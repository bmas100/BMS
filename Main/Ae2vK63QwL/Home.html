<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>سامانه هوشمند مدیریتی ریاست</title>

<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Variable-font-face.css" rel="stylesheet" type="text/css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- ================= PWA Code ================= -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1b4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="سامانه هوشمند مدیریتی ریاست">
<link rel="apple-touch-icon" href="BonyadLogo.png">
<!-- ============================================ -->

<style>
:root{
  --bg:#eef2fb; --bg2:#f8faff;
  --surface:rgba(255,255,255,.78); --surface-solid:#fff;
  --stroke:rgba(25,50,110,.10);
  --ink:#0d1b3e; --ink2:#5a6988;
  --shadow:0 10px 30px -14px rgba(25,50,110,.35);
  --accent:#3b82f6; --accent2:#06b6d4; --accent3:#8b5cf6;
  --gap:10px;
}
[data-theme="dark"]{
  --bg:#070d1f; --bg2:#0b1430;
  --surface:rgba(255,255,255,.06); --surface-solid:#111b3a;
  --stroke:rgba(255,255,255,.10);
  --ink:#eaf0ff; --ink2:#98a7cc;
  --shadow:0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:'Vazirmatn',Tahoma,sans-serif;touch-action:manipulation;transition:background .4s,color .4s}
body{overflow:hidden}
a{text-decoration:none;color:inherit}

/* ===== پس‌زمینه ===== */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:radial-gradient(110% 60% at 50% -10%,rgba(99,140,255,.28),transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg))}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.45;will-change:transform}
.o1{width:62vw;height:62vw;max-width:420px;max-height:420px;background:#7aa7ff;top:-16vw;right:-18vw;animation:f1 22s ease-in-out infinite alternate}
.o2{width:52vw;height:52vw;max-width:360px;max-height:360px;background:#b79bff;top:45%;left:-22vw;opacity:.35;animation:f2 26s ease-in-out infinite alternate}
.o3{width:46vw;height:46vw;max-width:320px;max-height:320px;background:#4fe0ee;bottom:-14vw;right:-8vw;opacity:.32;animation:f3 30s ease-in-out infinite alternate}
[data-theme="dark"] .orb{opacity:.22}
@keyframes f1{to{transform:translate(-12vw,14vh) scale(1.2)}}
@keyframes f2{to{transform:translate(16vw,-10vh) scale(1.15)}}
@keyframes f3{to{transform:translate(-14vw,-12vh) scale(1.25)}}
.bg::after{content:'';position:absolute;inset:0;
  background-image:radial-gradient(rgba(60,90,160,.14) 1px,transparent 1px);background-size:22px 22px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 10%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 20%,#000 10%,transparent 70%)}

.shell{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;
  padding:max(10px,env(safe-area-inset-top)) 12px 0;gap:12px}

/* ===== هدر ===== */
.hero{flex:0 0 auto;position:relative;border-radius:28px;padding:14px 14px 12px;color:#fff;overflow:hidden;
  background:
    radial-gradient(90% 140% at 100% 0%,rgba(6,182,212,.55),transparent 55%),
    radial-gradient(80% 120% at 0% 100%,rgba(139,92,246,.55),transparent 55%),
    linear-gradient(135deg,#0b1b4d,#1e3a9e 60%,#1d4ed8);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 22px 40px -18px rgba(20,50,170,.75),inset 0 1px 0 rgba(255,255,255,.3);
  animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.2) 50%,transparent 65%);
  transform:translateX(-120%);animation:shine 12s ease-in-out infinite}
.hero::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.22) 1px,transparent 1px);background-size:16px 16px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 80%);mask-image:linear-gradient(180deg,#000,transparent 80%)}
@keyframes shine{0%,15%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
@keyframes rise{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.avatar{position:relative;flex:0 0 auto;width:clamp(60px,15vw,76px);aspect-ratio:1;border-radius:50%;padding:3px;
  background:conic-gradient(from 0deg,#67e8f9,#fff,#c4b5fd,#67e8f9);animation:spin 9s linear infinite;
  box-shadow:0 0 22px rgba(160,200,255,.6)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#fff;
  border:3px solid #10246b;animation:spin 9s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.titles{flex:1 1 auto;min-width:0;text-align:center}
.org{font-size:clamp(.62rem,2.6vw,.76rem);font-weight:600;color:#cfdcff;letter-spacing:.2px}
.title{margin:2px 0 6px;font-weight:900;line-height:1.7;font-size:clamp(.82rem,3.9vw,1.12rem);color:#fff;
  text-shadow:0 2px 12px rgba(0,0,0,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:.58rem;font-weight:700;
  padding:3px 10px;border-radius:999px;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.8)}70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}

.hero-bottom{position:relative;z-index:1;margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 12px;border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.greet{font-size:.78rem;font-weight:800}
.greet small{display:block;font-size:.6rem;font-weight:500;color:#cfdcff;margin-top:1px}
.clock{display:flex;align-items:center;gap:10px;font-size:.66rem;font-weight:700;white-space:nowrap}
.clock span{display:flex;align-items:center;gap:5px}
.clock i{opacity:.85}
.theme-btn{border:none;cursor:pointer;width:32px;height:32px;border-radius:11px;color:#fff;font-size:.8rem;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);transition:transform .2s,background .2s}
.theme-btn:active{transform:scale(.9)}

/* ===== جستجو ===== */
.search{flex:0 0 auto;position:relative;animation:rise .8s .1s cubic-bezier(.2,.8,.2,1) both}
.search input{width:100%;border:1px solid var(--stroke);outline:none;background:var(--surface);color:var(--ink);
  font-family:inherit;font-size:.82rem;font-weight:500;padding:13px 44px 13px 14px;border-radius:18px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);
  transition:border-color .25s,box-shadow .25s,background .25s}
.search input::placeholder{color:var(--ink2)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(59,130,246,.2)}
.search i{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:.9rem;pointer-events:none}

/* ===== بخش‌ها ===== */
.scroller{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;margin:0 -12px;padding:2px 12px 18px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 8px,#000 calc(100% - 18px),transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 8px,#000 calc(100% - 18px),transparent 100%)}
.scroller::-webkit-scrollbar{display:none}

.section{margin-bottom:16px}
.sec-head{display:flex;align-items:center;gap:8px;margin:25px 4px 10px}
.sec-bar{width:4px;height:18px;border-radius:4px;background:linear-gradient(180deg,var(--c1),var(--c2))}
.sec-title{font-size:.82rem;font-weight:900;color:var(--ink)}
.sec-count{margin-right:auto;font-size:.58rem;font-weight:700;color:var(--ink2);padding:2px 9px;border-radius:999px;
  background:var(--surface);border:1px solid var(--stroke)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}

.card{--h:215;--mx:50%;--my:0%;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:9px;padding:14px 4px 11px;min-height:98px;text-align:center;border-radius:20px;
  background:var(--surface);border:1px solid var(--stroke);box-shadow:var(--shadow);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;animation:pop .6s cubic-bezier(.2,.9,.25,1.15) forwards;animation-delay:calc(var(--i)*40ms + 220ms);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s;cursor:pointer}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:none}}
.card::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(130px circle at var(--mx) var(--my),hsl(var(--h) 100% 60%/.22),transparent 65%)}
.card::after{content:'';position:absolute;top:0;left:20%;right:20%;height:3px;border-radius:0 0 3px 3px;
  background:linear-gradient(90deg,transparent,hsl(var(--h) 92% 58%),hsl(calc(var(--h) + 40) 90% 52%),transparent);opacity:.95}
.card:hover,.card:focus-visible{transform:translateY(-4px);outline:none;border-color:hsl(var(--h) 90% 60%/.55);
  box-shadow:0 18px 30px -14px hsl(var(--h) 90% 50%/.55)}
.card:hover::before,.card:active::before{opacity:1}
.card:active{transform:scale(.94)}

.icon{position:relative;width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,hsl(var(--h) 92% 62%),hsl(calc(var(--h) + 40) 90% 48%));
  box-shadow:0 10px 18px -6px hsl(var(--h) 92% 50%/.7),inset 0 1px 0 rgba(255,255,255,.55);
  animation:bob 4.8s ease-in-out infinite;animation-delay:calc(var(--i)*160ms)}
.icon::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.45),transparent 50%)}
.icon i{position:relative;z-index:1;font-size:1.15rem;color:#fff;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.card p{margin:0;font-size:.66rem;font-weight:600;line-height:1.55;color:var(--ink);padding:0 3px}

.badge{position:absolute;top:7px;left:7px;font-size:.5rem;font-weight:800;padding:2px 7px;border-radius:999px;
  color:var(--ink2);background:var(--surface-solid);border:1px solid var(--stroke)}
.card.soon{filter:saturate(.55)}
.card.soon .icon{animation:none}

.card .blade{position:absolute;top:-45%;left:-70%;width:30%;height:200%;pointer-events:none;z-index:2;transform:rotate(22deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:blade 22s ease-in-out infinite;animation-delay:calc(var(--i)*600ms)}
[data-theme="dark"] .card .blade{background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent)}
@keyframes blade{0%{left:-70%}16%{left:130%}100%{left:130%}}

.empty{display:none;text-align:center;color:var(--ink2);font-size:.82rem;padding:34px 0}
.empty i{display:block;font-size:1.8rem;margin-bottom:8px;opacity:.6}

.footer{flex:0 0 auto;display:flex;justify-content:center;padding:2px 0 max(5px,env(safe-area-inset-bottom))}
.footer-img{display:block;width:300px;max-width:90%;max-height:34px;object-fit:contain;margin-top:6px}
[data-theme="dark"] .footer-img{filter:brightness(1.6) contrast(.9)}

/* ===== پاپ‌آپ ===== */
.popup-overlay{position:fixed;inset:0;z-index:1000;background:rgba(7,13,40,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s,visibility .3s}
.popup-overlay.active{opacity:1;visibility:visible;pointer-events:auto}
.popup-content{position:fixed;z-index:1001;left:50%;bottom:0;width:100%;max-width:480px;transform:translate(-50%,105%);
  padding:10px 18px max(20px,env(safe-area-inset-bottom));border-radius:32px 32px 0 0;
  background:linear-gradient(180deg,var(--surface-solid),var(--bg));border:1px solid var(--stroke);border-bottom:none;
  box-shadow:0 -24px 60px rgba(7,13,40,.4);transition:transform .5s cubic-bezier(.2,.9,.25,1.05);max-height:85dvh;overflow-y:auto}
.popup-content.active{transform:translate(-50%,0)}
.popup-content::before{content:'';position:absolute;top:0;left:20%;right:20%;height:3px;background:linear-gradient(90deg,transparent,var(--accent2),var(--accent),transparent)}
.grabber{width:46px;height:5px;border-radius:5px;background:var(--stroke);margin:4px auto 12px;filter:brightness(.7)}
.popup-title{text-align:center;margin-bottom:14px;font-size:1.02rem;font-weight:900;
  background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.popup-body{display:flex;flex-direction:column;gap:9px}
.popup-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--stroke);
  font-weight:700;font-size:.84rem;color:var(--ink);box-shadow:var(--shadow);opacity:0;transform:translateY(12px);
  animation:pop2 .5s cubic-bezier(.2,.9,.25,1.1) forwards;animation-delay:calc(var(--k)*60ms + 150ms);transition:background .2s,transform .15s,border-color .2s}
@keyframes pop2{to{opacity:1;transform:none}}
.popup-btn .num{flex:0 0 auto;width:32px;height:32px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:.78rem;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent3));box-shadow:0 6px 12px -4px rgba(59,130,246,.6)}
.popup-btn .label{flex:1;line-height:1.55}
.popup-btn i{color:var(--accent);font-size:.74rem}
.popup-btn:hover{border-color:rgba(59,130,246,.5)}
.popup-btn:active{transform:scale(.97)}
.popup-btn.disabled{opacity:.5!important}
.close-popup-btn{margin-top:14px;width:100%;padding:13px;border:none;color:#fff;background:linear-gradient(90deg,#1d4ed8,#0891b2);border-radius:16px;
  font-family:inherit;font-weight:800;font-size:.88rem;cursor:pointer;box-shadow:0 12px 22px -10px rgba(29,78,216,.75);transition:transform .15s,filter .2s}
.close-popup-btn:active{transform:scale(.97);filter:brightness(1.08)}

/* Toast */
.toast{position:fixed;left:50%;bottom:max(70px,env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:2000;
  background:var(--ink);color:var(--bg);font-size:.76rem;font-weight:700;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s;box-shadow:0 12px 24px -8px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== نسخه ۲: بنر، ساعت، جستجو در بنر، نشان به‌زودی ===== */
.badge{color:#fff;border:none;background:linear-gradient(135deg,#f59e0b,#ef4444);box-shadow:0 4px 10px -3px rgba(239,68,68,.6)}
.hero{background-size:100% 100%,100% 100%,240% 240%;
  animation:rise .8s cubic-bezier(.2,.8,.2,1) both,hflow 10s ease-in-out infinite alternate;     margin-bottom: -10px;}
@keyframes hflow{0%{background-position:0 0,0 0,0% 50%}100%{background-position:0 0,0 0,100% 50%}}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fx span{position:absolute;bottom:-30px;left:var(--l);width:var(--s);height:var(--s);border-radius:50%;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);animation:bub var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes bub{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-200px) scale(1.15);opacity:0}}
.hero-bottom{gap:10px;padding:5px 12px;margin-top:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 22px -14px rgba(0,0,0,.5)}
.dt{display:flex;flex-direction:column;align-items:center;line-height:1.55;flex:0 0 auto;text-align:center}
.dt b{font-size:.82rem;font-weight:800;color:#dbe7ff}
.dt span{font-size:0.8rem;font-weight:900;direction:ltr;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.clock{flex:0 0 auto}
.tm b{display:block;font-size:0.8rem;font-weight:900;direction:ltr;letter-spacing:.6px;
  font-variant-numeric:tabular-nums;min-width:5.6ch;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.hs{position:relative;  /* flex:1 1 auto;  */min-width:0;display:block}
.hs input{width:100%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.18);color:#fff;border-radius:14px;
  padding:5px 30px 5px 8px;font-family:inherit;font-size:.74rem;font-weight:600;outline:none;transition:background .25s,box-shadow .25s}
.hs input::placeholder{color:#dbe7ff}
.hs input:focus{background:#fff;color:#0d1b3e;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.hs input:focus::placeholder{color:#7b8aae}
.hs i{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:#fff;font-size:.78rem;pointer-events:none}
.hs:focus-within i{color:#1d4ed8}
.chips .theme-btn{width:24px;height:24px;border-radius:50%;font-size:1rem;  margin-right:5px  ;padding:0;display:inline-flex;align-items:center;justify-content:center}
@media (max-width:360px){.dt span{font-size:.8rem}.tm b{font-size:0.8rem}.hero-bottom{gap:7px;padding:7px}}

/* ===== باکس تاریخ/ساعت/جستجو در فوتر (خارج از بنر) ===== */
.footer .hero-bottom{
  width:100%;margin-top:0;color:#fff;overflow:hidden;
  background:
    radial-gradient(90% 140% at 100% 0%,rgba(6,182,212,.55),transparent 55%),
    radial-gradient(80% 120% at 0% 100%,rgba(139,92,246,.55),transparent 55%),
    linear-gradient(135deg,#0b1b4d,#1e3a9e 60%,#1d4ed8);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 14px 26px -14px rgba(20,50,170,.75),inset 0 1px 0 rgba(255,255,255,.3)}

@media (min-width:600px){
  .shell{max-width:680px;margin:0 auto}
  .grid{grid-template-columns:repeat(4,1fr)}
}
@media (min-width:900px){
  .shell{max-width:820px}
  .grid{grid-template-columns:repeat(5,1fr)}
}
@media (orientation:landscape) and (max-height:600px){
  html,body{overflow:auto!important}
  .shell{height:auto!important;min-height:100vh}
  .scroller{overflow:visible;-webkit-mask-image:none;mask-image:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .card,.popup-btn{opacity:1}
}
</style>
</head>
<body>

<div class="bg"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>

<!-- ================= پاپ‌آپ ================= -->
<div id="popup-overlay" class="popup-overlay" onclick="closePopup()"></div>
<div id="popup-content" class="popup-content" role="dialog" aria-modal="true">
  <div class="grabber"></div>
  <div id="popup-title" class="popup-title"></div>
  <div id="popup-body" class="popup-body"></div>
  <button class="close-popup-btn" onclick="closePopup()">بستن</button>
</div>

<div class="toast" id="toast">این بخش به‌زودی فعال می‌شود</div>

<div class="shell">

  <header class="hero">
    <div class="fx">
      <span style="--s:14px;--l:8%;--d:9s;--dl:0s"></span>
      <span style="--s:22px;--l:22%;--d:12s;--dl:2s"></span>
      <span style="--s:10px;--l:38%;--d:8s;--dl:4s"></span>
      <span style="--s:18px;--l:55%;--d:11s;--dl:1s"></span>
      <span style="--s:12px;--l:70%;--d:10s;--dl:3s"></span>
      <span style="--s:24px;--l:84%;--d:13s;--dl:5s"></span>
      <span style="--s:9px;--l:94%;--d:9s;--dl:6s"></span>
    </div>
    <div class="hero-top">
      <div class="avatar"><img src="BonyadLogo.png" alt="لوگو بنیاد"></div>
      <div class="titles">

const faDigits = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

// رندر کارت‌ها
(function() {
  const root = document.getElementById('sections');
  let i = 0;
  sections.forEach(sec => {
    const s = document.createElement('section');
    s.className = 'section';
    s.innerHTML = `<div class="sec-head" style="--c1:${sec.c1};--c2:${sec.c2}">
        <span class="sec-bar"></span><span class="sec-title">${sec.title}</span>
        <span class="sec-count">${faDigits(sec.items.length)} بخش</span></div>
      <div class="grid"></div>`;
    const grid = s.querySelector('.grid');
    sec.items.forEach(it => {
      const a = document.createElement('a');
      const soon = !it.link && !it.popup;
      a.className = 'card' + (soon ? ' soon' : '');
      a.style.cssText = `--i:${i++};--h:${it.h}`;
      a.href = it.link || '#';
      if (it.link) a.target = '_blank';
      a.innerHTML = `<span class="blade"></span>${soon ? '<span class="badge">به‌زودی</span>' : ''}
        <div class="icon"><i class="fa-solid ${it.ic}"></i></div><p>${it.t}</p>`;
      if (it.popup) a.addEventListener('click', e => { e.preventDefault(); openPopup(it.popup); });
      else if (soon) a.addEventListener('click', e => { e.preventDefault(); showToast(); });
      grid.appendChild(a);
    });
    root.appendChild(s);
  });
})();

// ================= پاپ‌آپ =================
function openPopup(key) {
  const data = popupsData[key];
  if (!data) return;
  document.getElementById('popup-title').innerText = data.title;
  const body = document.getElementById('popup-body');
  body.innerHTML = '';
  data.buttons.forEach((btn, idx) => {
    const a = document.createElement('a');
    a.href = btn.link; a.target = "_blank";
    a.className = "popup-btn" + (btn.link === "#" ? " disabled" : "");
    a.style.setProperty('--k', idx);
    a.innerHTML = `<span class="num">${faDigits(idx + 1)}</span><span class="label">${btn.text}</span><i class="fa-solid fa-chevron-left"></i>`;
    if (btn.link === "#") a.addEventListener('click', e => { e.preventDefault(); showToast(); });
    body.appendChild(a);
  });
  document.getElementById('popup-overlay').classList.add('active');
  document.getElementById('popup-content').classList.add('active');
}
function closePopup() {
  document.getElementById('popup-overlay').classList.remove('active');
  document.getElementById('popup-content').classList.remove('active');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });

// Toast
let toastTimer;
function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// بستن پاپ‌آپ با کشیدن به پایین
(function() {
  const sheet = document.getElementById('popup-content');
  let startY = null, dy = 0;
  sheet.addEventListener('touchstart', e => { if (sheet.scrollTop <= 0) startY = e.touches[0].clientY; }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (startY === null) return;
    dy = Math.max(0, e.touches[0].clientY - startY);
    sheet.style.transition = 'none';
    sheet.style.transform = `translate(-50%, ${dy}px)`;
  }, { passive: true });
  sheet.addEventListener('touchend', () => {
    if (startY === null) return;
    sheet.style.transition = ''; sheet.style.transform = '';
    if (dy > 110) closePopup();
    startY = null; dy = 0;
  });
})();

// افکت نور دنبال‌کننده
document.querySelectorAll('.card').forEach(card => {
  const move = e => {
    const r = card.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    card.style.setProperty('--mx', (p.clientX - r.left) + 'px');
    card.style.setProperty('--my', (p.clientY - r.top) + 'px');
  };
  card.addEventListener('pointermove', move);
  card.addEventListener('touchstart', move, { passive: true });
});

// جستجو (با مخفی شدن بخش‌های خالی)
(function() {
  const input = document.getElementById('search-input');
  const secs = [...document.querySelectorAll('.section')];
  const empty = document.getElementById('empty');
  const norm = s => s.replace(/[يى]/g, 'ی').replace(/ك/g, 'ک').replace(/\u200c/g, ' ').trim();
  input.addEventListener('input', () => {
    const q = norm(input.value);
    let shown = 0;
    secs.forEach(sec => {
      let n = 0;
      sec.querySelectorAll('.card').forEach(c => {
        const ok = !q || norm(c.textContent).includes(q);
        c.style.display = ok ? '' : 'none';
        if (ok) n++;
      });
      sec.style.display = n ? '' : 'none';
      shown += n;
    });
    empty.style.display = shown ? 'none' : 'block';
  });
})();

// تاریخ و ساعت
(function() {
  const dEl = document.getElementById('today-date');
  const tEl = document.getElementById('today-time');
  function tick() {
    const now = new Date();
    try {
      const f = new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn', { year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(now);
      const g = t => f.find(p => p.type === t).value;
      dEl.textContent = g('year') + '/' + g('month') + '/' + g('day');
      tEl.textContent = new Intl.DateTimeFormat('fa-IR-u-nu-latn', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(now);
    } catch (e) { dEl.textContent = now.toLocaleDateString('fa-IR'); }
  }
  tick(); setInterval(tick, 1000);
})();

// تم روشن/تیره
(function() {
  const root = document.documentElement;
  const btn = document.getElementById('theme-btn');
  const icon = btn.querySelector('i');
  function apply(t) {
    root.setAttribute('data-theme', t);
    icon.className = t === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'dark' ? '#070d1f' : '#0b1b4d');
  }
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  apply(saved || 'light');
  btn.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  });
})();
