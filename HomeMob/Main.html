    <!-- ================= استایل‌های پاپ‌آپ و پیشواز ================= -->
    <style>
        /* صفحه پیشواز */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1e3a8a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-out, visibility 0.8s;
        }
        #splash-screen img {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 8px solid rgba(255, 255, 255, 0.3);
            object-fit: cover;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        /* پنجره‌های پاپ‌آپ */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s;
            backdrop-filter: blur(3px);
        }
        .popup-content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: #fff;
            width: 85%;
            max-width: 400px;
            border-radius: 15px;
            padding: 20px;
            z-index: 1001;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .popup-overlay.active, .popup-content.active {
            opacity: 1;
            visibility: visible;
        }
        .popup-content.active {
            transform: translate(-50%, -50%) scale(1);
        }
        .popup-title {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 15px;
            font-size: 1.2rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
            font-weight: bold;
        }
        .popup-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .popup-btn {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            color: #334155;
            text-decoration: none;
            font-weight: bold;
            display: block;
            transition: background 0.2s;
        }
        .popup-btn:hover {
            background: #e2e8f0;
        }
        .close-popup-btn {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
    <!-- ========================================================== -->
</head>
<body>

        <!-- ================= اسکریپت کنترل کش و آپدیت خودکار ================= -->
        <script>
            let refreshing = false;

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('sw.js').then(function(registration) {
                        
                        // بررسی اجباری برای آپدیت Service Worker
                        registration.update();

                    }).catch(function(err) {
                        console.log('ServiceWorker registration failed: ', err);
                    });
                });

                // این بخش منتظر پیام تغییر کنترلر (نسخه جدید) می‌ماند
                // به محض اینکه sw.js جدید جایگزین شد، صفحه را اتوماتیک رفرش می‌کند
                navigator.serviceWorker.addEventListener('controllerchange', function() {
                    if (!refreshing) {
                        window.location.reload();
                        refreshing = true;
                    }
                });
            }
        </script>

    <!-- ================= کدهای اجرایی مربوط به پاپ‌آپ و پیشواز ================= -->
    <script>
        // مخفی شدن صفحه پیشواز (Splash Screen)
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
            }, 2500); // زمان مکث 2.5 ثانیه (قابل تغییر)
        });

        // تنظیمات داده‌های هر پاپ‌آپ
        const popupsData = {
            evaluation: {
                title: "ارزیابی عملکرد",
                buttons: [
                    { text: "ستاد مرکزی", link: "../EvaluationMob/EvaHeadquarters.html" },
                    { text: "بنیاد مسکن استان‌ها", link: "../EvaluationMob/EvaluationMob.html" },
                    { text: "شرکتهای تابعه", link: "../SubsidiariesMob/SubsidiariesMob_3Mon.html" },
                    { text: "شاخص‌های ارزیابی", link: "../EvaluationMob/KPIs.html" }
                ]
            },
            provinces: {
                title: "امور استان‌ها",
                buttons: [
                    { text: "سفرهای استانی", link: "../ProvincesMob/Provincialrips.html" },
                    { text: "سفرهای ناحیه‌ای", link: "../ProvincesMob/RegionalTrips.html" }
                ]
            },
            subsidiaries: {
                title: "شرکت‌های تابعه",
                buttons: [
                    { text: "عملکرد اجرایی", link: "../SubsidiariesMob/SubsidiariesMob.html" },
                    { text: "عملکرد مالی و بودجه", link: "../SubsidiariesMob/SubsidiariesMob_3Mon.html" }
                ]
            }
        };

        // نمایش پاپ‌آپ
        function openPopup(key) {
            const data = popupsData[key];
            if (!data) return;

            document.getElementById('popup-title').innerText = data.title;
            
            const body = document.getElementById('popup-body');
            body.innerHTML = '';
            
            data.buttons.forEach(btn => {
                const a = document.createElement('a');
                a.href = btn.link;
                a.target = "_blank"; // باز شدن در صفحه جدید
                a.className = "popup-btn";
                a.innerText = btn.text;
                body.appendChild(a);
            });

            document.getElementById('popup-overlay').classList.add('active');
            document.getElementById('popup-content').classList.add('active');
        }

        // بستن پاپ‌آپ
        function closePopup() {
            document.getElementById('popup-overlay').classList.remove('active');
            document.getElementById('popup-content').classList.remove('active');
        }
    </script>
