<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سامانه هوشمند مدیریتی ریاست</title>

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Variable-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- توجه: چون فایل‌های style.css و banner.css در اختیار نبودند، تمام استایل صفحه به‌صورت یکپارچه و داخلی نوشته شده است -->

    <!-- ================= PWA Code ================= -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fffaf5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="سامانه هوشمند مدیریتی ریاست">
    <link rel="apple-touch-icon" href="BonyadLogo.png">
    <!-- ============================================ -->

    <style>
        :root {
            --bg-page: #fff9f2;
            --white: #ffffff;
            --panel: rgba(255, 255, 255, 0.72);
            --panel-line: rgba(255, 138, 0, 0.16);
            --card-bg: #ffffff;
            --ink: #2b1a0d;
            --text-2: #9a8571;
            --orange-1: #ff6a00;
            --orange-2: #ff8f1f;
            --orange-3: #ffb300;
            --gold: #ffcf4d;
            --hot: #ff4d5e;
            --live: #21c07a;
            --danger-1: #e3452c;
            --danger-2: #ff7a3d;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--bg-page);
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            color: var(--ink);
        }

        a { text-decoration: none; color: inherit; }

        /* ================= پس‌زمینه ملایم ================= */
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background: var(--bg-page);
        }
        .bg-mesh span {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            will-change: transform;
        }
        .blob-1 {
            width: 58vw; height: 58vw;
            background: radial-gradient(circle, rgba(255,106,0,0.20), transparent 70%);
            top: -20vw; right: -16vw;
            animation: drift1 24s ease-in-out infinite alternate;
        }
        .blob-2 {
            width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(255,179,0,0.18), transparent 70%);
            bottom: -18vw; left: -16vw;
            animation: drift2 28s ease-in-out infinite alternate;
        }
        @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(-5%, 6%) scale(1.12); } }
        @keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(6%, -5%) scale(1.15); } }

        /* ================= صفحه پیشواز ================= */
        #splash-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            background: var(--bg-page);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.7s ease, visibility 0.7s;
        }
        #splash-screen img {
            width: min(38vw, 190px);
            height: min(38vw, 190px);
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid var(--white);
            box-shadow: 0 0 0 3px var(--orange-2), 0 16px 40px rgba(255,106,0,0.28);
            animation: splashPulse 1.8s ease-in-out infinite;
        }
        @keyframes splashPulse {
            0%, 100% { box-shadow: 0 0 0 3px var(--orange-2), 0 0 0 0 rgba(255,148,51,0.35), 0 16px 40px rgba(255,106,0,0.28); }
            50% { box-shadow: 0 0 0 3px var(--orange-2), 0 0 0 12px rgba(255,148,51,0), 0 16px 46px rgba(255,106,0,0.4); }
        }

        /* ================= پنجره‌های پاپ‌آپ (بدون افکت تیره روی پس‌زمینه) ================= */
        .popup-overlay {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            background: transparent;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s;
            pointer-events: none;
        }
        .popup-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }

        .popup-content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            background: var(--white);
            width: 86%;
            max-width: 400px;
            border-radius: 22px;
            padding: 22px 20px 20px;
            z-index: 1001;
            opacity: 0;
            visibility: hidden;
            border: 1px solid var(--panel-line);
            box-shadow: 0 24px 60px rgba(255, 106, 0, 0.22), 0 8px 20px rgba(43,26,13,0.12);
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.25, 1.3), opacity 0.3s ease, visibility 0.4s;
        }
        .popup-content.active { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

        .popup-title {
            text-align: center;
            margin-bottom: 18px;
            font-size: clamp(1rem, 4vw, 1.2rem);
            font-weight: 800;
            background: linear-gradient(90deg, var(--orange-1), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            position: relative;
            padding-bottom: 12px;
        }
        .popup-title::after {
            content: '';
            position: absolute;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 46px; height: 3px;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--orange-1), var(--gold));
        }
        .popup-body { display: flex; flex-direction: column; gap: 10px; }
        .popup-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #fff6ea;
            border: 1px solid var(--panel-line);
            padding: 14px 16px;
            border-radius: 14px;
            color: var(--ink);
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
        }
        .popup-btn i { color: var(--orange-1); font-size: 0.8rem; }
        .popup-btn:active {
            background: #ffe8cc;
            border-color: var(--orange-2);
            transform: scale(0.98);
        }
        .close-popup-btn {
            margin-top: 16px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, var(--danger-1), var(--danger-2));
            color: white;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: filter 0.2s ease, transform 0.2s ease;
        }
        .close-popup-btn:active { transform: scale(0.97); filter: brightness(1.08); }

        /* ================= چارچوب اصلی ================= */
        .shell {
            position: relative;
            z-index: 1;
            height: 100dvh;
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 1.6vh, 14px);
            padding: clamp(8px, 1.6vh, 14px);
            overflow: hidden;
        }

        .glass-panel {
            background: var(--panel);
            border: 1px solid var(--panel-line);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            box-shadow: 0 10px 28px rgba(255, 138, 0, 0.10);
        }

        /* ================= بنر ================= */
        .banner {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: clamp(8px, 2.5vw, 14px);
            padding: clamp(10px, 1.8vh, 14px) clamp(12px, 3.5vw, 18px);
            position: relative;
        }

        .avatar-ring {
            position: relative;
            width: clamp(46px, 12vw, 58px);
            height: clamp(46px, 12vw, 58px);
            flex: 0 0 auto;
            border-radius: 50%;
            padding: 2.5px;
            background: linear-gradient(135deg, var(--orange-1), var(--gold));
            box-shadow: 0 6px 16px rgba(255, 106, 0, 0.28);
            animation: ringBreathe 3.6s ease-in-out infinite;
        }
        .avatar-ring img {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 2.5px solid var(--white);
            background: var(--white);
        }
        @keyframes ringBreathe {
            0%, 100% { box-shadow: 0 6px 16px rgba(255,106,0,0.25); }
            50% { box-shadow: 0 6px 22px rgba(255,106,0,0.42); }
        }

        .titles { flex: 1 1 auto; text-align: center; min-width: 0; }
        .titles h1 {
            margin: 0;
            font-size: clamp(0.9rem, 3.8vw, 1.2rem);
            font-weight: 800;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .titles h2 {
            margin: 3px 0 0;
            font-size: clamp(0.66rem, 2.8vw, 0.85rem);
            font-weight: 700;
            background: linear-gradient(90deg, var(--orange-1), var(--orange-3));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .meta-row {
            margin-top: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .status-pill, .version-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 999px;
            border: 1px solid var(--panel-line);
            background: #fff6ea;
            color: var(--text-2);
        }
        .status-pill .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--live);
            box-shadow: 0 0 0 0 rgba(33, 192, 122, 0.55);
            animation: livePulse 1.8s ease-in-out infinite;
        }
        @keyframes livePulse {
            0% { box-shadow: 0 0 0 0 rgba(33,192,122,0.5); }
            70% { box-shadow: 0 0 0 6px rgba(33,192,122,0); }
            100% { box-shadow: 0 0 0 0 rgba(33,192,122,0); }
        }
        .version-chip { color: var(--orange-1); }

        /* ================= پنل شبکه دسترسی ================= */
        .quick-panel {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: clamp(10px, 1.8vh, 14px) clamp(10px, 3vw, 14px);
        }

        .grid-container {
            flex: 1 1 auto;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, minmax(0, 1fr));
            gap: clamp(8px, 2vw, 12px);
        }

        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(4px, 1.3vh, 8px);
            text-align: center;
            padding: 4px;
            border-radius: 18px;
            background:
                linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
                linear-gradient(135deg, var(--orange-2), var(--gold)) border-box;
            border: 1.5px solid transparent;
            box-shadow: 0 4px 14px rgba(255, 138, 0, 0.10);
            overflow: hidden;
            animation: cardIn 0.5s cubic-bezier(0.2,0.8,0.2,1) both, glowBreathe 3.6s ease-in-out infinite;
            animation-delay: calc(var(--i) * 45ms), calc(var(--i) * 220ms);
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(10px) scale(0.94); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes glowBreathe {
            0%, 100% { box-shadow: 0 4px 14px rgba(255,138,0,0.10); }
            50% { box-shadow: 0 8px 22px rgba(255,138,0,0.22); }
        }
        .card:active { transform: scale(0.96); }

        .card .sweep {
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.55) 50%, transparent 65%);
            transform: translateX(-140%);
            pointer-events: none;
            animation: sweepMove 5s ease-in-out infinite;
            animation-delay: calc(var(--i) * 380ms);
        }
        @keyframes sweepMove {
            0% { transform: translateX(-140%); }
            35%, 100% { transform: translateX(140%); }
        }

        .icon-wrapper {
            position: relative;
            width: clamp(44px, 14vw, 60px);
            height: clamp(44px, 14vw, 60px);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, var(--icon-a, var(--orange-1)), var(--icon-b, var(--gold)));
            box-shadow:
                0 6px 14px var(--icon-shadow, rgba(255,106,0,0.35)),
                inset 0 -3px 5px rgba(0,0,0,0.14),
                inset 0 2px 3px rgba(255,255,255,0.55);
            animation: iconFloat 3.2s ease-in-out infinite;
            animation-delay: calc(var(--i) * 140ms);
        }
        .icon-wrapper::after {
            content: '';
            position: absolute;
            top: 10%; left: 14%;
            width: 50%; height: 32%;
            border-radius: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.75), transparent);
            pointer-events: none;
        }
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .icon-wrapper i {
            position: relative;
            z-index: 1;
            font-size: clamp(1.05rem, 4.6vw, 1.5rem);
            color: var(--white);
            text-shadow: 0 1px 2px rgba(0,0,0,0.18);
        }

        .card p {
            margin: 0;
            font-size: clamp(0.56rem, 2.5vw, 0.74rem);
            font-weight: 700;
            line-height: 1.25;
            color: var(--ink);
            padding: 0 3px;
        }

        .card:nth-child(6n+1) { --icon-a: #ff6a00; --icon-b: #ffb04a; --icon-shadow: rgba(255,106,0,0.4); }
        .card:nth-child(6n+2) { --icon-a: #ff8f1f; --icon-b: #ffd166; --icon-shadow: rgba(255,143,31,0.4); }
        .card:nth-child(6n+3) { --icon-a: #ff5a3d; --icon-b: #ff9e4d; --icon-shadow: rgba(255,90,61,0.4); }
        .card:nth-child(6n+4) { --icon-a: #ff9433; --icon-b: #ffcf4d; --icon-shadow: rgba(255,148,51,0.4); }
        .card:nth-child(6n+5) { --icon-a: #ff4d5e; --icon-b: #ff9040; --icon-shadow: rgba(255,77,94,0.4); }
        .card:nth-child(6n+6) { --icon-a: #ffa93e; --icon-b: #ffe08a; --icon-shadow: rgba(255,169,62,0.4); }

        /* ================= نوار پایین ================= */
        .footer-bar {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: clamp(6px, 1.2vh, 10px) 14px;
        }
        .footer-line {
            flex: 1 1 auto;
            max-width: 120px;
            height: 2px;
            border-radius: 2px;
            background: linear-gradient(90deg, transparent, var(--orange-1), var(--gold), var(--orange-1), transparent);
            background-size: 220% 100%;
            animation: linePan 3.5s linear infinite;
        }
        @keyframes linePan { 0% { background-position: 0% 0; } 100% { background-position: 220% 0; } }
        .footer-mark {
            width: clamp(20px, 5vh, 26px);
            height: clamp(20px, 5vh, 26px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(140deg, var(--orange-1), var(--gold));
            color: var(--white);
            font-size: 0.65rem;
            box-shadow: 0 4px 10px rgba(255,106,0,0.3);
            animation: glowBreathe 3s ease-in-out infinite;
        }

        @media (prefers-reduced-motion: reduce) {
            .bg-mesh span, .card, .icon-wrapper, .card .sweep, #splash-screen img,
            .avatar-ring, .status-pill .dot, .footer-line, .footer-mark {
                animation: none !important;
            }
        }
        @media (max-height: 620px) {
            .titles h2 { display: none; }
        }
    </style>
</head>
<body>

    <div class="bg-mesh"><span class="blob-1"></span><span class="blob-2"></span></div>

    <!-- ================= بخش پیشواز ================= -->
    <div id="splash-screen">
        <img src="./BonyadLogo.png" alt="تصویر شروع">
    </div>

    <!-- ================= لایه‌های پاپ‌آپ ================= -->
    <div id="popup-overlay" class="popup-overlay" onclick="closePopup()"></div>
    <div id="popup-content" class="popup-content">
        <div id="popup-title" class="popup-title"></div>
        <div id="popup-body" class="popup-body"></div>
        <button class="close-popup-btn" onclick="closePopup()">بستن</button>
    </div>

    <div class="shell">

        <header class="banner glass-panel">
            <div class="avatar-ring"><img src="BonyadLogo.png" alt="لوگو بنیاد"></div>

            <div class="titles">
                <h1>بنیاد مسکن انقلاب اسلامی</h1>
                <h2>سامانه هوشمند مدیریتی ریاست</h2>
                <div class="meta-row">
                    <span class="status-pill"><span class="dot"></span>سامانه فعال</span>
                    <span class="version-chip">نسخه ۱.۰</span>
                </div>
            </div>

            <!-- تصویر کاربر -->
            <div class="avatar-ring"><img src="./UserPic/Boss.png" alt="ریاست بنیاد" id="user-avatar" onerror="this.onerror=null; this.src='./UserPic/Boss.png';"></div>

            <script>
                // اسکریپت تشخیص هویت کاربر بر اساس لینک اختصاصی
                (function() {
                    const params = new URLSearchParams(window.location.search);
                    const userCode = params.get("u");

                    // اگر لینک حاوی پارامتر u بود، آن را ذخیره کن
                    if (userCode) {
                        localStorage.setItem("UserCode", userCode);
                    }

                    // خواندن کد نهایی از حافظه
                    const finalCode = localStorage.getItem("UserCode");
                    if (finalCode && finalCode !== "Unknown") {
                        document.getElementById('user-avatar').src = './UserPic/' + finalCode + '.jpg';
                    }
                })();
            </script>
        </header>

        <div class="quick-panel glass-panel">
            <div class="grid-container">
                <!-- ردیف 1 -->
                <a href="../CentralCouncilMob/CentralCouncilMob.html" target="_blank" class="card" style="--i:0">
                    <span class="sweep"></span>
                    <div class="icon-wrapper"><i class="fa-solid fa-sitemap"></i></div>
                    <p>شورای مرکزی</p>
                </a>
                <a href="https://bmas100.github.io/War/WarReport.html" target="_blank" class="card" style="--i:1">
                    <span class="sweep"></span>
                    <div class="icon-wrapper"><i class="fa-solid fa-person-digging"></i></div>
                    <p>بازسازی جنگ رمضان</p>
                </a>

                <!-- ردیف 2 -->
                <a href="#" onclick="openPopup('provinces'); return false;" class="card" style="--i:2">
                    <span class="sweep"></span>
                    <div class="icon-wrapper"><i class="fa-solid fa-map-location-dot"></i></div>
                    <p>امور استان‌ها</p>
                </a>
                <a href="#" onclick="openPopup('subsidiaries'); return false;" class="card" style="--i:3">
                    <span class="sweep"></span>
                    <div class="icon-wrapper"><i class="fa-solid fa-building"></i></div>
                    <p>شرکت‌های تابعه</p>
                </a>

                <!-- ردیف 3 -->
                <a href="#" onclick="openPopup('evaluation'); return false;" class="card" style="--i:4">
                    <span class="sweep"></span>
                    <div class="icon-wrapper"><i class="fa-solid fa-chart-line"></i></div>
                    <p>ارزیابی عملکرد</p>
                </a>
                <a href="#" target="_blank" class="card" onclick="openEvaluation(event)" style="--i:5">
                    <span class="sweep"></span>
                    <div class="icon-wrapper"><i class="fa-solid fa-user-tie"></i></div>
                    <p>ارزیابی مدیران</p>
                </a>

                <script>
                function openEvaluation(event) {
                    event.preventDefault();

                    // دریافت پارامتر u از URL فعلی
                    const params = new URLSearchParams(window.location.search);
                    const u = params.get('u');

                    // ساخت آدرس صفحه ارزیابی
                    const url = `../EvaluationMob/Eva_ProvMng.html?u=${encodeURIComponent(u || '')}`;

                    // باز کردن در صفحه جدید
                    window.open(url, '_blank');
                }
                </script>

                <!-- ردیف 4 -->
                <a href="#" target="_blank" class="card" style="--i:6">
                    <span class="sweep"></span>
                    <div class="icon-wrapper"><i class="fa-solid fa-house-chimney-window"></i></div>
                    <p>خانه امید</p>
                </a>
                <a href="../LegalMob/LegalMob.html" target="_blank" class="card" style="--i:7">
                    <span class="sweep"></span>
                    <div class="icon-wrapper"><i class="fa-solid fa-scale-balanced"></i></div>
                    <p>حقوقی و املاک</p>
                </a>

                <!-- ردیف 5 -->
                <a href="../HrmMob/HrmMob.html" target="_blank" class="card" style="--i:8">
                    <span class="sweep"></span>
                    <div class="icon-wrapper"><i class="fa-solid fa-users-gear"></i></div>
                    <p>منابع انسانی</p>
                </a>
                <a href="../SystemsMob/SystemsMob.html" target="_blank" class="card" style="--i:9">
                    <span class="sweep"></span>
                    <div class="icon-wrapper"><i class="fa-solid fa-server"></i></div>
                    <p>پلتفرم‌های بنیادمسکن</p>
                </a>

                <!-- ردیف 6 -->
                <a href="#" target="_blank" class="card" style="--i:10">
                    <span class="sweep"></span>
                    <div class="icon-wrapper"><i class="fa-solid fa-comments"></i></div>
                    <p>ارتباط با ریاست</p>
                </a>
                <a href="#" target="_blank" class="card" style="--i:11">
                    <span class="sweep"></span>
                    <div class="icon-wrapper"><i class="fa-solid fa-globe"></i></div>
                    <p>رسانه‌ها و فضای مجازی</p>
                </a>

        <!-- نوار تزیینی پایین صفحه به‌جای تصویر Footer.png -->
        <div class="footer-bar" aria-hidden="true">
            <span class="footer-line"></span>
            <span class="footer-mark"><i class="fa-solid fa-house-chimney-window"></i></span>
            <span class="footer-line"></span>
        </div>

        <!-- ================= اسکریپت کنترل کش و آپدیت خودکار ================= -->
        <script>
            let refreshing = false;

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('sw.js').then(function(registration) {

                        // بررسی اجباری برای آپدیت Service Worker
                        registration.update();

                    }).catch(function(err) {
                        console.log('ServiceWorker registration failed: ', err);
                    });
                });

                // این بخش منتظر پیام تغییر کنترلر (نسخه جدید) می‌ماند
                // به محض اینکه sw.js جدید جایگزین شد، صفحه را اتوماتیک رفرش می‌کند
                navigator.serviceWorker.addEventListener('controllerchange', function() {
                    if (!refreshing) {
                        window.location.reload();
                        refreshing = true;
                    }
                });
            }
        </script>
        <!-- ================================================================ -->

    </div>

    <!-- ================= کدهای اجرایی مربوط به پاپ‌آپ و پیشواز ================= -->
    <script>
        // مخفی شدن صفحه پیشواز (Splash Screen)
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
            }, 1000); // زمان مکث  1ثانیه (قابل تغییر)
        });

        // تنظیمات داده‌های هر پاپ‌آپ
        const popupsData = {
            evaluation: {
                title: "ارزیابی عملکرد",
                buttons: [
                    { text: "ستاد مرکزی", link: "../EvaluationMob/EvaHeadquarters.html" },
                    { text: "بنیاد مسکن استان‌ها", link: "../EvaluationMob/EvaluationMob.html" },
                    { text: "شرکتهای تابعه", link: "../SubsidiariesMob/SubsidiariesMob.html" },
                    { text: "شاخص‌های عملکرد", link: "../EvaluationMob/KPIs.html" }
                ]
            },
            provinces: {
                title: "امور استان‌ها",
                buttons: [
                    { text: "سفرهای استانی", link: "../ProvincesMob/Provincal_Visits.html" },
                    { text: "سفرهای ناحیه‌ای", link: "../ProvincesMob/Provincal_Region.html" }
                ]
            },
            subsidiaries: {
                title: "شرکت‌های تابعه",
                buttons: [
                    { text: "عملکرد دوره‌ای", link: "../SubsidiariesMob/SubsidiariesMob.html" },
                    { text: "عملکرد مالی و بودجه", link: "../SubsidiariesMob/SubsidiariesMob_3Mon.html" }
                ]
            }
        };

        // نمایش پاپ‌آپ
        function openPopup(key) {
            const data = popupsData[key];
            if (!data) return;

            document.getElementById('popup-title').innerText = data.title;

            const body = document.getElementById('popup-body');
            body.innerHTML = '';

            data.buttons.forEach(btn => {
                const a = document.createElement('a');
                a.href = btn.link;
                a.target = "_blank"; // باز شدن در صفحه جدید
                a.className = "popup-btn";
                a.innerHTML = `<span>${btn.text}</span><i class="fa-solid fa-chevron-left"></i>`;
                body.appendChild(a);
            });

            document.getElementById('popup-overlay').classList.add('active');
            document.getElementById('popup-content').classList.add('active');
        }

        // بستن پاپ‌آپ
        function closePopup() {
            document.getElementById('popup-overlay').classList.remove('active');
            document.getElementById('popup-content').classList.remove('active');
        }
    </script>
