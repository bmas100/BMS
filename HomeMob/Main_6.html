<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سامانه هوشمند مدیریتی ریاست</title>

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-Variable-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- توجه: چون فایل‌های style.css و banner.css در اختیار نبودند، تمام استایل صفحه به‌صورت یکپارچه و داخلی نوشته شده است -->
    <!-- ایده طراحی: الهام از نقشه‌های مهندسی/بلوپرینت (رنگ آبی، خطوط شبکه، نشانه‌گذاری‌های فنی) که با هویت «بنیاد مسکن» هم‌خوان است -->

    <!-- ================= PWA Code ================= -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a1c38">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="سامانه هوشمند مدیریتی ریاست">
    <link rel="apple-touch-icon" href="BonyadLogo.png">
    <!-- ============================================ -->

    <style>
        :root {
            --bg-0: #0a1c38;
            --bg-1: #0f2b52;
            --bg-2: #123a68;
            --accent-1: #29b6f6;
            --accent-2: #00e5ff;
            --accent-3: #7fd9ff;
            --deep: #0d47a1;
            --white: #ffffff;
            --text-1: #eef6ff;
            --text-2: #9fb9dd;
            --text-3: #6f89ad;
            --line: rgba(127, 217, 255, 0.28);
            --live: #2be08a;
            --danger-1: #ff4d6d;
            --danger-2: #ff7a90;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--bg-0);
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            color: var(--text-1);
        }

        a { text-decoration: none; color: inherit; }

        /* ================= پس‌زمینه پویا ================= */
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(41, 182, 246, 0.16), transparent 55%),
                radial-gradient(ellipse at 100% 100%, rgba(0, 229, 255, 0.14), transparent 50%),
                var(--bg-0);
        }
        .bg-mesh span {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.6;
            will-change: transform;
        }
        .blob-1 { width: 55vw; height: 55vw; background: radial-gradient(circle, var(--accent-1), transparent 70%); top: -20vw; right: -14vw; animation: drift1 24s ease-in-out infinite alternate; }
        .blob-2 { width: 48vw; height: 48vw; background: radial-gradient(circle, var(--deep), transparent 70%); bottom: -18vw; left: -14vw; animation: drift2 28s ease-in-out infinite alternate; }
        @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(-6%, 6%) scale(1.15); } }
        @keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(6%, -6%) scale(1.18); } }

        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(127, 217, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(127, 217, 255, 0.06) 1px, transparent 1px);
            background-size: 26px 26px;
        }

        /* ================= صفحه پیشواز ================= */
        #splash-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            background: var(--bg-0);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.7s ease, visibility 0.7s;
        }
        #splash-screen img {
            width: min(38vw, 190px);
            height: min(38vw, 190px);
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid var(--bg-1);
            box-shadow: 0 0 0 3px var(--accent-1), 0 0 45px rgba(41, 182, 246, 0.45);
            animation: splashPulse 1.8s ease-in-out infinite;
        }
        @keyframes splashPulse {
            0%, 100% { box-shadow: 0 0 0 3px var(--accent-1), 0 0 0 0 rgba(41,182,246,0.4), 0 0 45px rgba(41,182,246,0.4); }
            50% { box-shadow: 0 0 0 3px var(--accent-1), 0 0 0 14px rgba(41,182,246,0), 0 0 55px rgba(41,182,246,0.55); }
        }

        /* ================= پاپ‌آپ (بدون افکت تیره روی پس‌زمینه) ================= */
        .popup-overlay {
            position: fixed; inset: 0; width: 100vw; height: 100dvh;
            background: transparent; z-index: 1000;
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: opacity 0.25s ease, visibility 0.25s;
        }
        .popup-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }

        .popup-content {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            background: linear-gradient(165deg, #123a68, #0a1c38);
            width: 86%; max-width: 400px;
            border-radius: 22px;
            padding: 22px 20px 20px;
            z-index: 1001;
            opacity: 0; visibility: hidden;
            border: 1px solid var(--line);
            box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 40px rgba(41, 182, 246, 0.18);
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.25, 1.3), opacity 0.3s ease, visibility 0.4s;
            overflow: hidden;
        }
        .popup-content.active { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
        .popup-content .sweep {
            position: absolute; inset: 0;
            background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.10) 50%, transparent 60%);
            transform: translateX(-140%);
            animation: sweepMove 5s ease-in-out infinite;
            pointer-events: none;
        }

        .popup-title {
            text-align: center; margin-bottom: 18px;
            font-size: clamp(1rem, 4vw, 1.2rem); font-weight: 800;
            background: linear-gradient(90deg, var(--accent-3), var(--accent-1));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            position: relative; padding-bottom: 12px;
        }
        .popup-title::after {
            content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 46px; height: 3px; border-radius: 3px;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
        }
        .popup-body { display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 1; }
        .popup-btn {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--line);
            padding: 14px 16px; border-radius: 14px;
            color: var(--text-1); font-weight: 600; font-size: 0.9rem;
            transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
        }
        .popup-btn i { color: var(--accent-2); font-size: 0.8rem; }
        .popup-btn:active { background: rgba(41,182,246,0.16); border-color: var(--accent-1); transform: scale(0.98); }
        .close-popup-btn {
            margin-top: 16px; width: 100%; padding: 12px;
            background: linear-gradient(90deg, var(--danger-1), var(--danger-2));
            color: white; border: none; border-radius: 12px;
            font-family: inherit; font-weight: 700; cursor: pointer; font-size: 0.9rem;
            transition: filter 0.2s ease, transform 0.2s ease;
        }
        .close-popup-btn:active { transform: scale(0.97); filter: brightness(1.1); }

        /* ================= چارچوب اصلی ================= */
        .shell {
            position: relative; z-index: 1;
            height: 100dvh; height: 100vh;
            display: flex; flex-direction: column;
            gap: clamp(10px, 1.8vh, 16px);
            padding: 0 clamp(6px, 1.4vw, 10px) clamp(4px, 1vh, 8px);
            overflow: hidden;
        }

        /* ================= بنر پویا ================= */
        .banner {
            flex: 0 0 auto;
            position: relative;
            display: flex; align-items: center; justify-content: space-between;
            gap: clamp(8px, 2.5vw, 14px);
            margin-top: clamp(6px, 1.2vh, 10px);
            padding: clamp(12px, 2.2vh, 18px) clamp(14px, 4vw, 20px);
            background: linear-gradient(150deg, #14407a 0%, #0d2c58 55%, #0a1c38 100%);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.14);
            overflow: hidden;
            box-shadow: 0 10px 26px rgba(0,0,0,0.32);
        }
        .banner .grid-overlay {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px);
            background-size: 20px 20px;
            -webkit-mask-image: radial-gradient(ellipse at 50% 0%, black 40%, transparent 85%);
            mask-image: radial-gradient(ellipse at 50% 0%, black 40%, transparent 85%);
        }
        .banner .glow {
            position: absolute; width: 220px; height: 220px; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,229,255,0.35), transparent 70%);
            top: -110px; right: -60px;
            animation: bannerGlow 6s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes bannerGlow { from { transform: translate(0,0) scale(1); opacity: 0.7; } to { transform: translate(-24px, 16px) scale(1.2); opacity: 1; } }
        .banner .scan {
            position: absolute; top: 0; bottom: 0; width: 45%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16), transparent);
            transform: translateX(-140%);
            animation: scanMove 6s linear infinite;
            mix-blend-mode: screen;
            pointer-events: none;
        }
        @keyframes scanMove { 0% { transform: translateX(-140%); } 100% { transform: translateX(220%); } }

        .avatar-ring {
            position: relative; z-index: 1;
            width: clamp(46px, 12vw, 58px); height: clamp(46px, 12vw, 58px);
            flex: 0 0 auto; border-radius: 50%; padding: 2.5px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 6px 16px rgba(0, 229, 255, 0.3);
            animation: ringBreathe 3.6s ease-in-out infinite;
        }
        .avatar-ring img {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block;
            border: 2.5px solid var(--bg-1); background: var(--bg-1);
        }
        @keyframes ringBreathe {
            0%, 100% { box-shadow: 0 6px 16px rgba(0,229,255,0.25); }
            50% { box-shadow: 0 6px 24px rgba(0,229,255,0.5); }
        }

        .titles { flex: 1 1 auto; text-align: center; min-width: 0; position: relative; z-index: 1; }
        .titles h1 {
            margin: 0; font-size: clamp(0.9rem, 3.8vw, 1.2rem); font-weight: 800; color: var(--white);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .titles h2 {
            margin: 3px 0 0; font-size: clamp(0.66rem, 2.8vw, 0.85rem); font-weight: 700;
            background: linear-gradient(90deg, var(--accent-3), var(--accent-2));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .meta-row { margin-top: 7px; display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
        .status-pill, .version-chip {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 0.6rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06);
            color: var(--text-2);
        }
        .status-pill .dot {
            width: 6px; height: 6px; border-radius: 50%; background: var(--live);
            box-shadow: 0 0 0 0 rgba(43, 224, 138, 0.55);
            animation: livePulse 1.8s ease-in-out infinite;
        }
        @keyframes livePulse { 0% { box-shadow: 0 0 0 0 rgba(43,224,138,0.5); } 70% { box-shadow: 0 0 0 6px rgba(43,224,138,0); } 100% { box-shadow: 0 0 0 0 rgba(43,224,138,0); } }
        .version-chip { color: var(--accent-2); }

        /* ================= شبکه کارت‌ها (بدون بک‌گراند) ================= */
        .grid-container {
            flex: 1 1 auto; min-height: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, minmax(0, 1fr));
            gap: clamp(4px, 1vw, 8px);
            padding: clamp(10px, 2vh, 16px) clamp(10px, 3vw, 16px);
        }

        .card {
            position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: clamp(9px, 2.2vh, 15px);
            text-align: center;
            border-radius: 18px;
            padding: 6px 4px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255,255,255,0.10);
            animation: cardIn 0.5s cubic-bezier(0.2,0.8,0.2,1) both;
            animation-delay: calc(var(--i) * 45ms);
        }
        @keyframes cardIn { from { opacity: 0; transform: translateY(10px) scale(0.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .card:active { transform: scale(0.97); }
        .card:active .icon-wrapper { transform: scale(0.92); }

        /* نشانه‌های گوشه به‌سبک نقشه‌های فنی - تزیین روی بک‌گراند شیشه‌ای */
        .card::before, .card::after {
            content: '';
            position: absolute;
            width: 10px; height: 10px;
            border: 1.5px solid var(--accent-2);
            opacity: 0.45;
            animation: bracketBreathe 3.4s ease-in-out infinite;
            animation-delay: calc(var(--i) * 200ms);
        }
        .card::before { top: 5px; right: 5px; border-bottom: none; border-left: none; }
        .card::after { bottom: 5px; left: 5px; border-top: none; border-right: none; }
        @keyframes bracketBreathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.8; } }

        /* افکت تیغه‌ای (پرتو نور عبوری) روی کل کارت */
        .card .sweep {
            position: absolute; inset: 0; border-radius: 16px; overflow: hidden;
            pointer-events: none;
        }
        .card .sweep::before {
            content: '';
            position: absolute; top: -20%; bottom: -20%; width: 34%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
            filter: blur(3px);
            transform: translateX(-220%) skewX(-18deg);
            mix-blend-mode: screen;
            animation: sweepMove 8.5s ease-in-out infinite;
            animation-delay: calc(var(--i) * 550ms);
        }
        @keyframes sweepMove { 0% { transform: translateX(-220%) skewX(-18deg); } 45%, 100% { transform: translateX(260%) skewX(-18deg); } }

        .icon-wrapper {
            position: relative;
            width: clamp(44px, 14vw, 58px); height: clamp(44px, 14vw, 58px);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(160deg, var(--icon-a, var(--accent-1)), var(--icon-b, var(--deep)));
            box-shadow: 0 6px 16px var(--icon-shadow, rgba(41,182,246,0.4)), inset 0 -3px 5px rgba(0,0,0,0.2), inset 0 2px 3px rgba(255,255,255,0.35);
            animation: iconFloat 3.2s ease-in-out infinite;
            animation-delay: calc(var(--i) * 140ms);
            transition: transform 0.15s ease;
        }
        .icon-wrapper::after {
            content: '';
            position: absolute; top: 10%; left: 14%; width: 50%; height: 32%;
            border-radius: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.6), transparent);
            pointer-events: none;
        }
        @keyframes iconFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        .icon-wrapper i {
            position: relative; z-index: 1;
            font-size: clamp(1.05rem, 4.6vw, 1.45rem);
            color: var(--white);
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        .card p {
            margin: 0;
            font-size: clamp(0.56rem, 2.5vw, 0.74rem);
            font-weight: 700; line-height: 1.25;
            color: var(--text-1);
            padding: 0 3px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }

        .card:nth-child(6n+1) { --icon-a: #29b6f6; --icon-b: #0d47a1; --icon-shadow: rgba(41,182,246,0.45); }
        .card:nth-child(6n+2) { --icon-a: #00c6e5; --icon-b: #0d6ba1; --icon-shadow: rgba(0,198,229,0.45); }
        .card:nth-child(6n+3) { --icon-a: #4fc3f7; --icon-b: #1565c0; --icon-shadow: rgba(79,195,247,0.45); }
        .card:nth-child(6n+4) { --icon-a: #26c6da; --icon-b: #00838f; --icon-shadow: rgba(38,198,218,0.45); }
        .card:nth-child(6n+5) { --icon-a: #42a5f5; --icon-b: #0b3d91; --icon-shadow: rgba(66,165,245,0.45); }
        .card:nth-child(6n+6) { --icon-a: #18ffff; --icon-b: #0277bd; --icon-shadow: rgba(24,255,255,0.4); }

        /* ================= نوار پایین ================= */
        .footer-bar {
            flex: 0 0 auto;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: clamp(6px, 1.2vh, 10px) 14px;
        }
        .footer-line {
            flex: 1 1 auto; max-width: 120px; height: 2px; border-radius: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-1), var(--accent-2), var(--accent-1), transparent);
            background-size: 220% 100%;
            animation: linePan 3.5s linear infinite;
        }
        @keyframes linePan { 0% { background-position: 0% 0; } 100% { background-position: 220% 0; } }
        .footer-mark {
            width: clamp(20px, 5vh, 26px); height: clamp(20px, 5vh, 26px); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(140deg, var(--accent-1), var(--accent-2));
            color: var(--bg-0); font-size: 0.65rem;
            box-shadow: 0 4px 10px rgba(0,229,255,0.35);
            animation: glowPulse 3s ease-in-out infinite;
        }
        @keyframes glowPulse { 0%, 100% { box-shadow: 0 4px 10px rgba(0,229,255,0.3); } 50% { box-shadow: 0 4px 16px rgba(0,229,255,0.55); } }

        @media (prefers-reduced-motion: reduce) {
            .bg-mesh span, .card, .icon-wrapper, .card .sweep::before, #splash-screen img,
            .avatar-ring, .status-pill .dot, .footer-line, .footer-mark, .banner .scan, .banner .glow, .card::before, .card::after {
                animation: none !important;
            }
        }
        @media (max-height: 620px) { .titles h2 { display: none; } }
    </style>
</head>
<body>

    <div class="bg-mesh"><span class="blob-1"></span><span class="blob-2"></span></div>
    <div class="bg-grid"></div>

    <!-- ================= بخش پیشواز ================= -->
    <div id="splash-screen">
        <img src="./BonyadLogo.png" alt="تصویر شروع">
    </div>

    <!-- ================= لایه‌های پاپ‌آپ ================= -->
    <div id="popup-overlay" class="popup-overlay" onclick="closePopup()"></div>
    <div id="popup-content" class="popup-content">
        <span class="sweep"></span>
        <div id="popup-title" class="popup-title"></div>
        <div id="popup-body" class="popup-body"></div>
        <button class="close-popup-btn" onclick="closePopup()">بستن</button>
    </div>

    <div class="shell">

        <header class="banner">
            <span class="grid-overlay"></span>
            <span class="glow"></span>
            <span class="scan"></span>

            <div class="avatar-ring"><img src="BonyadLogo.png" alt="لوگو بنیاد"></div>

            <div class="titles">
                <h1>سامانه هوشمند مدیریتی ریاست</h1>
                <h2>بنیاد مسکن انقلاب اسلامی</h2>
                <div class="meta-row">
                    <span class="status-pill">اداره کل حوزه ریاست</span>
                    <span class="version-chip"><span class="dot"></span>نسخه ۱.۰</span>
                </div>
            </div>

            <!-- تصویر کاربر -->
            <div class="avatar-ring"><img src="./UserPic/Boss.png" alt="ریاست بنیاد" id="user-avatar" onerror="this.onerror=null; this.src='./UserPic/Boss.png';"></div>

            <script>
                // اسکریپت تشخیص هویت کاربر بر اساس لینک اختصاصی
                (function() {
                    const params = new URLSearchParams(window.location.search);
                    const userCode = params.get("u");

                    // اگر لینک حاوی پارامتر u بود، آن را ذخیره کن
                    if (userCode) {
                        localStorage.setItem("UserCode", userCode);
                    }

                    // خواندن کد نهایی از حافظه
                    const finalCode = localStorage.getItem("UserCode");
                    if (finalCode && finalCode !== "Unknown") {
                        document.getElementById('user-avatar').src = './UserPic/' + finalCode + '.jpg';
                    }
                })();
            </script>
        </header>

        <div class="grid-container">
            <!-- ردیف 1 -->
            <a href="../CentralCouncilMob/CentralCouncilMob.html" target="_blank" class="card" style="--i:0">
                <span class="sweep"></span>
                <div class="icon-wrapper"><i class="fa-solid fa-sitemap"></i></div>
                <p>شورای مرکزی</p>
            </a>
            <a href="https://bmas100.github.io/War/WarReport.html" target="_blank" class="card" style="--i:1">
                <span class="sweep"></span>
                <div class="icon-wrapper"><i class="fa-solid fa-person-digging"></i></div>
                <p>بازسازی جنگ رمضان</p>

        <script>
            let refreshing = false;

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('sw.js').then(function(registration) {

                        // بررسی اجباری برای آپدیت Service Worker
                        registration.update();

                    }).catch(function(err) {
                        console.log('ServiceWorker registration failed: ', err);
                    });
                });

                // این بخش منتظر پیام تغییر کنترلر (نسخه جدید) می‌ماند
                // به محض اینکه sw.js جدید جایگزین شد، صفحه را اتوماتیک رفرش می‌کند
                navigator.serviceWorker.addEventListener('controllerchange', function() {
                    if (!refreshing) {
                        window.location.reload();
                        refreshing = true;
                    }
                });
            }
        </script>

    <script>
        // مخفی شدن صفحه پیشواز (Splash Screen)
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
            }, 1000); // زمان مکث  1ثانیه (قابل تغییر)
        });

        // تنظیمات داده‌های هر پاپ‌آپ
        const popupsData = {
            evaluation: {
                title: "ارزیابی عملکرد",
                buttons: [
                    { text: "ستاد مرکزی", link: "../EvaluationMob/EvaHeadquarters.html" },
                    { text: "بنیاد مسکن استان‌ها", link: "../EvaluationMob/EvaluationMob.html" },
                    { text: "شرکتهای تابعه", link: "../SubsidiariesMob/SubsidiariesMob.html" },
                    { text: "شاخص‌های عملکرد", link: "../EvaluationMob/KPIs.html" }
                ]
            },
            provinces: {
                title: "امور استان‌ها",
                buttons: [
                    { text: "سفرهای استانی", link: "../ProvincesMob/Provincal_Visits.html" },
                    { text: "سفرهای ناحیه‌ای", link: "../ProvincesMob/Provincal_Region.html" }
                ]
            },
            subsidiaries: {
                title: "شرکت‌های تابعه",
                buttons: [
                    { text: "عملکرد دوره‌ای", link: "../SubsidiariesMob/SubsidiariesMob.html" },
                    { text: "عملکرد مالی و بودجه", link: "../SubsidiariesMob/SubsidiariesMob_3Mon.html" }
                ]
            }
        };

        // نمایش پاپ‌آپ
        function openPopup(key) {
            const data = popupsData[key];
            if (!data) return;

            document.getElementById('popup-title').innerText = data.title;

            const body = document.getElementById('popup-body');
            body.innerHTML = '';

            data.buttons.forEach(btn => {
                const a = document.createElement('a');
                a.href = btn.link;
                a.target = "_blank"; // باز شدن در صفحه جدید
                a.className = "popup-btn";
                a.innerHTML = `<span>${btn.text}</span><i class="fa-solid fa-chevron-left"></i>`;
                body.appendChild(a);
            });

            document.getElementById('popup-overlay').classList.add('active');
            document.getElementById('popup-content').classList.add('active');
        }

        // بستن پاپ‌آپ
        function closePopup() {
            document.getElementById('popup-overlay').classList.remove('active');
            document.getElementById('popup-content').classList.remove('active');
        }
    </script>
