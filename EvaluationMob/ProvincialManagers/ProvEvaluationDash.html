<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>داشبورد ارزیابی مدیران</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
body{margin:0;background:#f4f7fb;font-family:Vazirmatn}
.header{background:#12355b;color:#fff;text-align:center;padding:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px}
.card{background:#fff;border-radius:15px;border-top:4px solid #1565c0;padding:8px;box-shadow:0 4px 15px #0001}
.card:nth-child(even){background:#f8fbff}
.info{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:bold}
.info div{display:flex;align-items:center;gap:5px}
.info img{width:28px;height:28px;object-fit:contain;border-radius:50%}
.gauge{height:95px}
.tags{text-align:center;font-size:10px}.tag{padding:3px 8px;border-radius:15px}
.q{background:#dbeafe;color:#1d4ed8}.k{background:#dcfce7;color:#15803d}
@media(max-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:5px;padding:5px}.info{display:block;font-size:10px}.gauge{height:80px}}
</style>
</head>
<body>
<div class="header"><b>سامانه هوشمند مدیریتی ریاست</b><br>ارزیابی مدیران کل استان‌ها</div>
<div id="grid" class="grid"></div>
<script>
function ok(v){return v!==''&&v!=null&&!isNaN(v)}
function total(a,b){let s=0,w=0;if(ok(a)){s+=a*.7;w+=.7}if(ok(b)){s+=b*.3;w+=.3}return w?s/w:null}
function rank(v){if(v==null)return '-';if(v>=85)return'A';if(v>=70)return'B';if(v>=60)return'C';if(v>=50)return'D';return'F'}
function num(r){return {A:5,B:4,C:3,D:2,F:1}[r]||0}
function gauge(id,r){
let c=echarts.init(document.getElementById(id));
c.setOption({series:[{type:'gauge',startAngle:180,endAngle:0,min:0,max:5,radius:'100%',
axisLine:{lineStyle:{width:18,color:[[.2,'#d32f2f'],[.4,'#fb8c00'],[.6,'#fbc02d'],[.8,'#43a047'],[1,'#1565c0']]}},
axisLabel:{formatter:v=>['F','D','C','B','A'][v],fontSize:9},
pointer:{width:3},detail:{formatter:r,fontSize:28,offsetCenter:[0,'35%']},
data:[{value:num(r)}]}]})
}
fetch('Score_ProvEvaluation.xlsx').then(x=>x.arrayBuffer()).then(b=>{
let wb=XLSX.read(b,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets.Score);
grid.innerHTML=rows.map((x,i)=>`<div class="card"><div class="info"><div><img src="${x['آیکون استان']||''}">${x['استان']||''}</div><div><img src="${x['تصویر مدیرکل استان']||''}">${x['نام مدیرکل']||''}</div></div><div class="gauge" id="g${i}"></div><div class="tags"><span class="tag q">کمی ${ok(x['امتیاز کمی'])?'✓':'—'}</span> <span class="tag k">کیفی ${ok(x['امتیاز کیفی'])?'✓':'—'}</span></div></div>`).join('');
rows.forEach((x,i)=>gauge('g'+i,rank(total(x['امتیاز کمی'],x['امتیاز کیفی']))))
})
</script>
</body>
</html>
