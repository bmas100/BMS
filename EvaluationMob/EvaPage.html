<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>فرم ارزیابی عملکرد مدیران استانی</title>

    <!-- Vazirmatn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: "Vazirmatn", Tahoma, Arial, sans-serif;
            background: #f5f7fa;
        }

        body {
            overflow: hidden;
        }

        /* Porsline Container */
        #8k7N5K4f {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            min-height: 480px;
            z-index: 99999;
            background: #ffffff;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Loading */
        #porsline-loading-8k7N5K4f {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 42px;
            height: 42px;
            margin-top: -21px;
            margin-left: -21px;

            border: 4px solid rgba(0, 0, 0, 0.10);
            border-top: 4px solid #555;

            border-radius: 50%;
            animation: spin-8k7N5K4f 0.8s linear infinite;

            z-index: 100000;
        }

        @keyframes spin-8k7N5K4f {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Mobile */
        @media (max-width: 768px) {

            #8k7N5K4f {
                width: 100vw;
                height: 100dvh;
                min-height: 100dvh;
            }
        }
    </style>
</head>

<body>

    <div id="8k7N5K4f">

        <!-- Loading Indicator -->
        <div id="porsline-loading-8k7N5K4f"></div>

        <script>
            (function () {

                const container = document.getElementById("8k7N5K4f");
                const loadingIndicator =
                    document.getElementById("porsline-loading-8k7N5K4f");

                const script = document.createElement("script");

                script.type = "text/javascript";
                script.fetchPriority = "high";

                script.onload = function () {
                    if (loadingIndicator) {
                        loadingIndicator.style.display = "none";
                    }
                };

                script.onerror = function () {
                    if (loadingIndicator) {
                        loadingIndicator.style.display = "none";
                    }

                    const errorMessage = document.createElement("div");

                    errorMessage.style.cssText = `
                        position: fixed;
                        top: 50%;
                        left: 50%;
                        transform: translate(-50%, -50%);
                        text-align: center;
                        font-family: Vazirmatn, Tahoma, sans-serif;
                        color: #555;
                        font-size: 15px;
                        padding: 20px;
                    `;

                    errorMessage.innerHTML = `
                        <div style="font-size:42px;margin-bottom:10px;">⚠️</div>
                        <div>خطا در بارگذاری فرم</div>
                        <div style="font-size:13px;margin-top:8px;color:#888;">
                            لطفاً صفحه را مجدداً بارگذاری کنید.
                        </div>
                    `;

                    container.appendChild(errorMessage);
                };

                script.src =
                    "https://survey.porsline.ir/embed/eyJib3JkZXIiOiJub25lIiwid2lkdGgiOiIxMDAlIiwiaGVpZ2h0IjoiMTAwJSJ9/8k7N5K4f";

                container.appendChild(script);

            })();
        </script>

    </div>

</body>
</html>
