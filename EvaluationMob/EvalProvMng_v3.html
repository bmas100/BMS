<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ارزیابی مدیرکل استان</title>
<style>
@font-face{font-family:Vazirmatn;src:url('../CSS/Fonts/Vazirmatn-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Vazirmatn;src:url('../CSS/Fonts/Vazirmatn-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#eef2f7;color:#172033}
.banner{
  height:86px;min-height:86px;background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 100%);
  color:#fff;display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr);
  align-items:center;padding:8px 14px;border-bottom:3px solid #fbbf24;
  box-shadow:0 3px 12px rgba(0,0,0,.18);gap:14px;direction:ltr
}
.person{display:flex;align-items:center;min-width:0;gap:10px;direction:ltr}
.person.evaluator{justify-content:flex-start}
.person.subject{justify-content:flex-end}
.info{min-width:0;text-align:right;direction:rtl}
.person.evaluator .info,.person.subject .info{max-width:calc(100% - 68px)}
.photo{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #fbbf24;background:#fff;flex:none}
.role{font-size:10px;color:#fbbf24;font-weight:700;margin-bottom:2px;white-space:nowrap}
.name{font-size:14px;font-weight:700;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subline{font-size:10px;color:#dbe4f2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sep{width:1px;height:52px;background:rgba(255,255,255,.22)}
.frame-wrap{height:calc(100vh - 86px);width:100%;background:#fff}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.empty-state{height:100%;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:#f8fafc;color:#334155;direction:rtl}
.empty-box{width:min(520px,92vw);padding:22px 18px;border-radius:16px;background:#fff;border:1px solid #e2e8f0;box-shadow:0 8px 28px rgba(15,23,42,.08)}
.empty-title{font-weight:700;color:#b91c1c;font-size:16px;margin-bottom:8px}
.empty-text{font-size:12px;line-height:1.9;color:#64748b}
.photo.placeholder{visibility:hidden}
@media(max-width:600px){
  .banner{height:76px;min-height:76px;padding:6px 8px;gap:7px}
  .frame-wrap{height:calc(100vh - 76px)}
  .photo{width:50px;height:50px}
  .person{gap:6px}
  .name{font-size:11px}
  .role{font-size:8.5px}
  .subline{font-size:8.5px}
  .sep{height:44px}
  .person.evaluator .info,.person.subject .info{max-width:calc(100% - 56px)}
}
</style>
</head>
<body>
<header class="banner">
  <div class="person evaluator">
    <img id="evaluatorImage" class="photo placeholder" src="" alt="ارزیاب">
    <div class="info">
      <div class="role">ارزیاب</div>
      <div id="evaluatorName" class="name">—</div>
    </div>
  </div>

  <div class="sep"></div>

  <div class="person subject">
    <div class="info">
      <div class="role">ارزیاب‌شونده</div>
      <div id="managerName" class="name">—</div>
      <div id="provinceName" class="subline"></div>
    </div>
    <img id="managerImage" class="photo placeholder" src="" alt="مدیرکل استان">
  </div>
</header>

<div class="frame-wrap">
  <iframe id="surveyFrame" title="فرم ارزیابی مدیرکل استان" allow="fullscreen"></iframe>
  <div id="emptyState" class="empty-state">
    <div class="empty-box">
      <div id="emptyTitle" class="empty-title">لینک ارزیابی نامعتبر است</div>
      <div id="emptyText" class="empty-text"></div>
    </div>
  </div>
</div>

const frame=document.getElementById('surveyFrame');
const emptyState=document.getElementById('emptyState');
const emptyTitle=document.getElementById('emptyTitle');
const emptyText=document.getElementById('emptyText');

function showError(title,text){
  frame.removeAttribute('src');
  frame.style.display='none';
  emptyState.style.display='flex';
  emptyTitle.textContent=title;
  emptyText.textContent=text;
  document.getElementById('evaluatorName').textContent='—';
  document.getElementById('managerName').textContent='—';
  document.getElementById('provinceName').textContent='';
  document.getElementById('evaluatorImage').classList.add('placeholder');
  document.getElementById('managerImage').classList.add('placeholder');
}

function normalizeLegacySurvey(raw){
  if(!raw) return null;
  try{ raw=decodeURIComponent(raw); }catch(e){}
  if(raw.startsWith('https://survey.porsline.ir/')){
    try{
      const u=new URL(raw);
      const parts=u.pathname.split('/').filter(Boolean);
      if(parts.length===2 && parts[0]==='s' && u.searchParams.get('qs')){
        return {sid:parts[1],qs:u.searchParams.get('qs')};
      }
    }catch(e){}
  }
  const m=raw.match(/^\/?s\/([^?&/]+)\?qs=([^&#]+)$/i);
  return m ? {sid:m[1],qs:m[2]} : null;
}

const params=new URLSearchParams(window.location.search);
let sid=(params.get('sid')||'').trim();
let qs=(params.get('qs')||'').trim();

if((!sid || !qs) && params.get('survey')){
  const legacy=normalizeLegacySurvey(params.get('survey'));
  if(legacy){ sid=legacy.sid; qs=legacy.qs; }
}

if(!sid || !qs){
  showError(
    'لینک ارزیابی ناقص است',
    'آدرس باید دارای دو پارامتر sid و qs باشد؛ مانند: EvalProvMng.html?sid=aSOVDU2a&qs=B1Xcxc3bBPnvszc'
  );
} else if(!/^[A-Za-z0-9_-]+$/.test(sid) || !/^[A-Za-z0-9_-]+$/.test(qs)){
  showError('پارامترهای لینک نامعتبر است','مقادیر sid یا qs دارای کاراکتر نامعتبر هستند.');
} else {
  const targetUrl=`https://survey.porsline.ir/s/${sid}?qs=${qs}`;
  const record=records.find(r=>r.link===targetUrl);

  if(!record){
    showError('لینک ارزیابی شناسایی نشد','این لینک در فهرست Dedicated Link فایل ارزیابی‌ها وجود ندارد و هیچ فرمی بارگذاری نشد.');
  } else {
    const evaluatorName=evaluatorNames[record.evaluatorCode] || `ارزیاب ${record.evaluatorCode}`;

    document.getElementById('evaluatorName').textContent=evaluatorName;
    const managerImageSrc='../Images/ProvManagers/'+record.image;

    const evaluatorImage=document.getElementById('evaluatorImage');
    // ارزیاب‌های 01 تا 09: تصویر کنار همین فایل HTML است.
    // در ارزیاب 04 (خودارزیابی)، تصویر ارزیاب همان تصویر مدیرکل ارزیاب‌شونده است.
    evaluatorImage.src=record.evaluatorCode==='04' ? managerImageSrc : `./${record.evaluatorCode}.jpg`;
    evaluatorImage.alt=record.evaluatorCode==='04' ? record.manager : evaluatorName;
    evaluatorImage.classList.remove('placeholder');

    document.getElementById('managerName').textContent=record.manager;
    document.getElementById('provinceName').textContent=record.province;
    const managerImage=document.getElementById('managerImage');
    managerImage.src=managerImageSrc;
    managerImage.alt=record.manager;
    managerImage.classList.remove('placeholder');

    frame.style.display='block';
    emptyState.style.display='none';
    frame.src=targetUrl;
  }
}
