<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>سامانه مدیریتی ریاست - ارزیابی مدیران کل - ارزیاب 08</title>

    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('../CSS/Fonts/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Vazirmatn';
            src: url('../CSS/Fonts/Vazirmatn-Bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --primary: #1e3a8a;
            --accent: #fbbf24;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            color: var(--text-dark);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            background: linear-gradient(-45deg, #e0e7ff, #bae6fd, #bfdbfe, #ddd6fe);
            background-size: 300% 300%;
            animation: gradientBG 8s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header-banner {
            background: linear-gradient(135deg, rgba(15,23,42,0.95) 0%, rgba(30,58,138,0.95) 100%);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 20px;
            display: flex;
            direction: rtl;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            border-bottom: 4px solid var(--accent);
        }

        .evaluator-box {
            display: flex;
            direction: rtl;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 0 1 auto;
        }

        .evaluator-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            object-fit: cover;
            background-color: rgba(255,255,255,0.2);
            flex: 0 0 auto;
        }

        .evaluator-label {
            font-size: 0.83rem;
            font-weight: bold;
            color: #fff;
            line-height: 1.55;
            text-align: right;
            white-space: normal;
        }

        .evaluator-label .prefix {
            color: var(--accent);
        }

        .header-titles {
            display: flex;
            flex-direction: column;
               /* text-align: left;
            align-items: flex-end; */
            min-width: 0;
            flex: 1;
        }

        .header-titles h1 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .header-titles h2 {
            margin: 0 0 5px 0;
            font-size: 0.78rem;
            color: var(--accent);
            font-weight: bold;
            white-space: nowrap;
        }

        .container {
            padding: 20px 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        .managers-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        @media (min-width: 480px) {
            .managers-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .manager-card {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--card-bg);
            padding: 7px 5px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .manager-card:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .profile-wrapper {
            position: relative;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 8px;
        }

        .profile-wrapper::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: conic-gradient(transparent, transparent, transparent, var(--accent));
            animation: rotate 4s linear infinite;
        }

        .profile-wrapper::after {
            content: '';
            position: absolute;
            inset: 3px;
            background: #ffffff;
            border-radius: 50%;
        }

        .profile-image {
            position: relative;
            z-index: 10;
            width: calc(100% - 6px);
            height: calc(100% - 6px);
            border-radius: 50%;
            object-fit: cover;
            object-position: 0px 0px;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .manager-name {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--text-dark);
            text-align: center;
            margin: 0;
            white-space: nowrap;
        }

        .province-name {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-align: center;
            margin: 4px 0 0 0;
        }

        @media (max-width: 520px) {
            .header-banner {
                padding: 9px 10px;
                gap: 9px;
            }

            .evaluator-avatar {
                width: 44px;
                height: 44px;
            }

            .evaluator-box {
                gap: 7px;
                max-width: 62%;
            }

            .evaluator-label {
                font-size: 0.69rem;
                line-height: 1.45;
            }

            .header-titles h1 {
                font-size: 0.88rem;
            }

            .header-titles h2 {
                font-size: 0.62rem;
                margin-bottom: 3px;
            }
        }
    </style>
</head>
