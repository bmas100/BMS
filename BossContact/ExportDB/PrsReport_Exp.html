<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد مدیریتی سامانه ارتباط کارکنان با ریاست بنیاد مسکن</title>
    
    <!-- Vazirmatn Font -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { vazir: ['Vazirmatn', 'sans-serif'] },
                    colors: { brand: { dark: '#1e3a8a', light: '#3b82f6' } }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f3f4f6; }
        .banner-bg {
            background: linear-gradient(135deg, #0b1736 0%, #173b78 58%, #1e40af 100%);
            position: relative; overflow: hidden;
        }
        .banner-bg::before {
            content: ''; position: absolute; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            z-index: 0;
        }
        .chart-container { position: relative; height: 260px; width: 100%; }
        .line-clamp-3 {
            display: -webkit-box; -webkit-line-clamp: 3;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .modal-scroll::-webkit-scrollbar { width: 6px; }
        .modal-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .modal-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-gray-800 antialiased">

    <!-- ================= BANNER ================= -->
    <header class="banner-bg text-white shadow-lg rounded-b-3xl mb-6 pb-5 pt-5 px-4 md:px-8">
        <div class="max-w-7xl mx-auto relative z-10 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-center md:text-right">
                <h1 class="text-xl md:text-3xl font-bold mb-2 flex items-center justify-center md:justify-start gap-3">
                    <i class="fa-solid fa-building-columns text-blue-200"></i>
                    سامانه ارتباط کارکنان با ریاست بنیاد مسکن
                </h1>
                <p class="text-blue-100 text-sm md:text-base">داشبورد مدیریتی و تحلیل پیام‌های دریافتی</p>
            </div>
            <div class="flex flex-wrap justify-center gap-3">
                <div class="bg-white/20 backdrop-blur-md border border-white/30 rounded-full px-5 py-2 flex items-center gap-2 shadow-sm">
                    <i class="fa-regular fa-calendar-check text-blue-100"></i>
                    <span class="text-sm font-medium">تاریخ گزارش: <span id="reportDate">—</span></span>
                </div>
                <a href="./PRS.pdf" target="_blank" class="bg-blue-600 hover:bg-blue-500 transition-colors border border-blue-400 rounded-full px-5 py-2 flex items-center gap-2 shadow-sm cursor-pointer group">
                    <i class="fa-solid fa-file-pdf text-red-300 group-hover:text-red-200 transition-colors"></i>
                   <!-- <span class="text-sm font-medium">جزئیات گزارش</span> -->
                </a>
            </div>
        </div>
    </header>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="max-w-7xl mx-auto px-4 md:px-8 pb-12">
        
        <!-- KPI Cards (rendered by JS from xlsx) -->
        <div id="statusBox"></div>
        <section id="kpiContainer" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2 sm:gap-4 md:gap-5 mb-8"></section>

        <!-- Messages Cards -->
        <section>
            <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-5 gap-2">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-inbox text-gray-500"></i>
                    <span>لیست پیام‌های دریافتی (<span id="totalCount">۰</span> مورد)</span>
                </h2>
                <span class="text-xs text-gray-500 bg-gray-100 px-3 py-1.5 rounded-full inline-flex items-center gap-1 w-fit">
                    <i class="fa-solid fa-hand-pointer"></i>
                    جدیدترین پیام‌ها در ابتدا · برای مشاهده متن کامل روی هر کارت کلیک کنید
                </span>
            </div>
            
            <div id="cardsContainer" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 md:gap-5">
                <!-- Cards rendered by JS -->
            </div>
        </section>

        <!-- Charts Section -->
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-10">
            <!-- Pie Chart: Category -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 border-t-4 border-t-blue-500">
                <h3 class="text-base font-bold text-gray-800 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-blue-500"></i>
                    توزیع بر اساس دسته‌بندی
                </h3>
                <div class="chart-container">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
            
            <!-- Bar Chart: Organizational Unit -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 border-t-4 border-t-indigo-500">
                <h3 class="text-base font-bold text-gray-800 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-chart-bar text-indigo-500"></i>
                    توزیع بر اساس واحد سازمانی
                </h3>
                <div class="chart-container">
                    <canvas id="unitChart"></canvas>
                </div>
            </div>

            <!-- Horizontal Bar: Location -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 border-t-4 border-t-emerald-500">
                <h3 class="text-base font-bold text-gray-800 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-location-dot text-emerald-500"></i>
                    توزیع بر اساس محل خدمت
                </h3>
                <div class="chart-container">
                    <canvas id="locationChart"></canvas>
                </div>
            </div>
        </section>

    </main>

    <!-- ================= MODAL ================= -->
    <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-sm p-3 sm:p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[92vh] flex flex-col shadow-2xl overflow-hidden">
            <!-- Modal Header -->
            <div class="px-4 py-3 border-b border-gray-100 flex justify-between items-center bg-gradient-to-l from-blue-50 to-white flex-shrink-0">
                <h3 class="font-bold text-base text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-envelope-open-text text-blue-500"></i>
                    <span id="modalTitle">جزئیات پیام</span>
                </h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white border border-gray-200 hover:bg-red-50 hover:border-red-200 hover:text-red-500 flex items-center justify-center text-gray-600 transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <!-- Modal Body -->
            <div class="p-4 sm:p-5 overflow-y-auto modal-scroll flex-grow" id="modalBody">
                <!-- Dynamic content -->
            </div>
            <!-- Modal Footer -->
            <div class="px-4 py-2 border-t border-gray-100 bg-gray-50 flex justify-end flex-shrink-0">
                <button onclick="closeModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-medium px-5 py-2 rounded-lg transition-colors">
                    بستن
                </button>
            </div>
        </div>
    </div>

        <!-- ================= JAVASCRIPT ================= -->
    <script>
        // ================ CONFIG ================
        const XLSX_FILE = './PrsReport.xlsx';   // فایل اکسل کنار همین HTML

        // نگاشت ستون‌های اکسل (بر اساس نام سرستون، نه ترتیب)
        const COL = {
            id:'request_id', tracking:'tracking_code', name:'full_name', phone:'mobile',
            location:'service_location', province:'province', county:'county',
            holding:'holding', group:'company_group', unit:'unit', category:'category',
            subject:'subject', text:'message', date:'registered_at', status:'status'
        };

        let messages = [];
        let charts = [];

        // ================ HELPERS ================
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        const pad = n => String(n).padStart(2, '0');
        const clean = v => (v === null || v === undefined) ? '' : String(v).replace(/‌{2,}/g,'‌').trim();

        // تبدیل تاریخ میلادی به شمسی
        const jFmt = new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn', {year:'numeric', month:'2-digit', day:'2-digit'});
        function toJalali(y, m, d) {
            const parts = jFmt.formatToParts(new Date(y, m - 1, d, 12));
            const g = t => parts.find(p => p.type === t).value;
            return `${g('year')}/${g('month')}/${g('day')}`;
        }

        // خواندن تاریخ ثبت (متن، سریال اکسل یا Date) بدون وابستگی به منطقه زمانی
        function parseDate(v) {
            let y, mo, d, h = 0, mi = 0, s = 0;
            if (v instanceof Date) {
                y = v.getFullYear(); mo = v.getMonth() + 1; d = v.getDate();
                h = v.getHours(); mi = v.getMinutes(); s = v.getSeconds();
            } else if (typeof v === 'number') {
                const p = XLSX.SSF.parse_date_code(v);
                y = p.y; mo = p.m; d = p.d; h = p.H; mi = p.M; s = Math.round(p.S);
            } else {
                const m = String(v || '').match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
                if (!m) return null;
                [y, mo, d] = [+m[1], +m[2], +m[3]]; h = +(m[4] || 0); mi = +(m[5] || 0); s = +(m[6] || 0);
            }
            return {
                key: Date.UTC(y, mo - 1, d, h, mi, s),
                jDate: toJalali(y, mo, d),
                time: `${pad(h)}:${pad(mi)}`
            };
        }

        function normPhone(v) {
            let p = clean(v).replace(/\D/g, '');
            if (/^9\d{9}$/.test(p)) p = '0' + p;      // صفر ابتدایی که اکسل حذف کرده
            return p || 'نامشخص';
        }

        // ================ LOAD & PARSE XLSX ================
        function parseWorkbook(wb) {
            const ws = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(ws, {defval: '', raw: true});
            const list = rows.map((r, i) => {
                const dt = parseDate(r[COL.date]);
                return {
                    id: clean(r[COL.id]) || String(i + 1),
                    tracking: clean(r[COL.tracking]),
                    name: clean(r[COL.name]) || 'کاربر ناشناس',
                    phone: normPhone(r[COL.phone]),
                    location: clean(r[COL.location]) || 'نامشخص',
                    province: clean(r[COL.province]),
                    county: clean(r[COL.county]),
                    holding: clean(r[COL.holding]),
                    group: clean(r[COL.group]),
                    unit: clean(r[COL.unit]) || 'نامشخص',
                    category: clean(r[COL.category]) || 'نامشخص',
                    subject: clean(r[COL.subject]) || 'بدون موضوع',
                    text: String(r[COL.text] ?? '').trim(),
                    status: clean(r[COL.status]) || 'ثبت اولیه',
                    date: dt
                };
            }).filter(m => m.text || m.subject !== 'بدون موضوع');

            // جدیدترین در ابتدا؛ در تاریخ‌های مساوی، شناسه بزرگ‌تر اول
            list.sort((a, b) => ((b.date?.key ?? 0) - (a.date?.key ?? 0)) || (Number(b.id) - Number(a.id)));
            return list;
        }

        async function loadData() {
            showStatus('loading');
            try {
                const res = await fetch(XLSX_FILE + '?t=' + Date.now(), {cache: 'no-store'});
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const buf = await res.arrayBuffer();
                applyWorkbook(XLSX.read(buf, {type: 'array'}));
            } catch (e) {
                console.warn('خواندن خودکار فایل اکسل ممکن نشد:', e);
                showStatus('error');
            }
        }

        function loadFromPicker(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try { applyWorkbook(XLSX.read(e.target.result, {type: 'array'})); }
                catch (err) { console.error(err); showStatus('error'); }
            };
            reader.readAsArrayBuffer(file);
        }

        function applyWorkbook(wb) {
            messages = parseWorkbook(wb);
            showStatus('ok');
            renderAll();
        }

        function showStatus(state) {
            const box = document.getElementById('statusBox');
            if (state === 'ok') { box.innerHTML = ''; return; }
            if (state === 'loading') {
                box.innerHTML = `<div class="mb-6 bg-white rounded-2xl border border-gray-100 shadow-sm p-5 text-center text-gray-500 text-sm"><i class="fa-solid fa-spinner fa-spin ml-2"></i>در حال خواندن PrsReport.xlsx ...</div>`;
                return;
            }
            box.innerHTML = `
                <div class="mb-6 bg-amber-50 border border-amber-200 rounded-2xl p-5 text-sm text-amber-900">
                    <div class="font-bold mb-1 flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation"></i> فایل PrsReport.xlsx به‌صورت خودکار بارگذاری نشد</div>
                    <p class="leading-7 mb-3">این صفحه باید کنار فایل <span dir="ltr" class="font-mono">PrsReport.xlsx</span> و از طریق وب‌سرور باز شود (مرورگرها هنگام باز کردن مستقیم فایل از روی دیسک، خواندن فایل کناری را مجاز نمی‌دانند). در صورت نیاز می‌توانید فایل را به‌صورت دستی انتخاب کنید:</p>
                    <label class="inline-flex items-center gap-2 bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg cursor-pointer transition-colors">
                        <i class="fa-solid fa-file-excel"></i> انتخاب فایل اکسل
                        <input type="file" accept=".xlsx,.xls" class="hidden" onchange="loadFromPicker(this.files[0])">
                    </label>
                </div>`;
        }

        // ================ CATEGORY STYLES ================
        const catStyles = {
            'پیشنهاد':        {icon:'fa-lightbulb',            bg:'bg-amber-50',   text:'text-amber-600',   chart:'#f59e0b', kpi:'amber'},
            'درخواست':        {icon:'fa-hand',                 bg:'bg-teal-50',    text:'text-teal-600',    chart:'#14b8a6', kpi:'teal'},
            'تقدیر و تشکر':   {icon:'fa-heart',                bg:'bg-rose-50',    text:'text-rose-500',    chart:'#f43f5e', kpi:'rose'},
            'شکایت':          {icon:'fa-triangle-exclamation', bg:'bg-red-50',     text:'text-red-600',     chart:'#ef4444', kpi:'red'},
            'انتقاد':         {icon:'fa-comment-slash',        bg:'bg-orange-50',  text:'text-orange-600',  chart:'#f97316', kpi:'orange'},
            'طرح و ایده':     {icon:'fa-wand-magic-sparkles',  bg:'bg-violet-50',  text:'text-violet-600',  chart:'#8b5cf6', kpi:'violet'},
            'ملاقات حضوری':   {icon:'fa-handshake',            bg:'bg-sky-50',     text:'text-sky-600',     chart:'#0ea5e9', kpi:'sky'}
        };
        const defaultStyle = {icon:'fa-circle', bg:'bg-gray-50', text:'text-gray-600', chart:'#6b7280', kpi:'gray'};
        const styleOf = c => catStyles[c] || defaultStyle;

        function countBy(list, keyFn) {
            const m = new Map();
            list.forEach(x => { const k = keyFn(x); m.set(k, (m.get(k) || 0) + 1); });
            return m;
        }

        // ================ RENDER ================
        function renderAll() {
            document.getElementById('totalCount').textContent = fa(messages.length);
            const latest = messages.find(m => m.date);
            document.getElementById('reportDate').textContent = latest ? latest.date.jDate : '—';
            renderKpis();
            renderCards();
            renderCharts();
        }

        function renderKpis() {
            const counts = countBy(messages, m => m.category);
            const cats = [...counts.entries()].sort((a, b) => b[1] - a[1]);
            const kpi = (label, icon, color, value) => `
                <div class="bg-white rounded-2xl p-3 md:p-4 shadow-sm border border-gray-100 border-t-4 border-t-${color}-500 flex items-center justify-between hover:shadow-md transition-shadow">
                    <div class="min-w-0">
                        <p class="text-gray-500 text-xs mb-1 flex items-center gap-1.5 whitespace-nowrap">
                            <span class="w-6 h-6 rounded-full bg-${color}-50 text-${color}-600 inline-flex flex-shrink-0 items-center justify-center text-sm"><i class="fa-solid ${icon}"></i></span>
                            <span>${esc(label)}</span>
                        </p>
                        <h3 class="text-lg sm:text-2xl font-bold text-${color}-600">${fa(value)}</h3>
                    </div>
                </div>`;
            document.getElementById('kpiContainer').innerHTML =
                kpi('کل پیام‌ها', 'fa-envelope-open-text', 'blue', messages.length) +
                cats.map(([c, n]) => { const s = styleOf(c); return kpi(c, s.icon, s.kpi, n); }).join('');
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = messages.map((m, idx) => {
                const st = styleOf(m.category);
                return `
                <div onclick="openModal(${idx})"
                     class="relative bg-white rounded-2xl shadow-sm border border-gray-100 border-t-4 overflow-hidden hover:shadow-lg hover:-translate-y-0.5 active:scale-[0.99] transition-all cursor-pointer flex flex-col" style="border-top-color:${st.chart}">
                    <div class="px-3 py-2.5 border-b border-gray-50 bg-gray-50/50 flex justify-between items-center">
                        <div class="flex items-center gap-2 min-w-0">
                            <div class="h-7 min-w-7 px-2 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-[11px] font-bold flex-shrink-0">${esc(m.id)}</div>
                            <span class="font-bold text-gray-700 text-sm truncate">${esc(m.name)}</span>
                        </div>
                        <span class="bg-green-100 text-green-700 text-[10px] px-2 py-0.5 rounded-full font-medium whitespace-nowrap flex-shrink-0">${esc(m.status)}</span>
                    </div>
                    <div class="p-3 flex-grow">
                        <div class="flex flex-wrap gap-1.5 mb-2">
                            <span class="${st.bg} ${st.text} text-[10px] px-2 py-0.5 rounded-md flex items-center gap-1">
                                <i class="fa-solid ${st.icon}"></i> ${esc(m.category)}
                            </span>
                            <span class="bg-gray-100 text-gray-600 text-[10px] px-2 py-0.5 rounded-md flex items-center gap-1 min-w-0">
                                <i class="fa-solid fa-sitemap flex-shrink-0"></i> <span class="truncate">${esc(m.unit)}</span>
                            </span>
                        </div>
                        <h4 class="font-bold text-gray-900 mb-2 text-sm bg-gradient-to-l from-blue-50 to-white border-r-4 border-blue-500 rounded-md px-3 py-2 leading-6 shadow-sm">${esc(m.subject)}</h4>
                        <p class="text-xs text-gray-600 leading-relaxed line-clamp-3 whitespace-pre-line">${esc(m.text)}</p>
                    </div>
                    <div class="bg-gray-50 px-3 py-2 text-[10px] text-gray-500 flex justify-between items-center border-t border-gray-100 gap-2">
                        <span class="flex items-center gap-1 min-w-0 truncate"><i class="fa-regular fa-clock"></i> ${m.date ? `${m.date.jDate} - ${m.date.time}` : 'نامشخص'}</span>
                        <span dir="ltr" class="flex-shrink-0">${esc(m.phone)}</span>
                    </div>
                </div>`;
            }).join('');
        }

        // ================ MODAL ================
        function openModal(idx) {
            const m = messages[idx];
            const st = styleOf(m.category);
            const place = [m.location, m.province, m.county, m.holding, m.group].filter(Boolean).join(' › ');
            document.getElementById('modalTitle').textContent = `پیام شماره ${m.id} — ${m.name}`;
            const box = (icon, label, val, ltr) => `
                <div class="bg-gray-50 rounded-lg p-2.5 border border-gray-100">
                    <div class="text-[10px] text-gray-500 mb-0.5 flex items-center gap-1"><i class="fa-solid ${icon}"></i> ${label}</div>
                    <div class="font-bold text-sm text-gray-800" ${ltr ? 'dir="ltr"' : ''}>${esc(val)}</div>
                </div>`;
            document.getElementById('modalBody').innerHTML = `
                <div class="space-y-4">
                    <div class="flex flex-wrap gap-2 items-center">
                        <span class="${st.bg} ${st.text} text-xs px-3 py-1 rounded-md flex items-center gap-1 font-medium">
                            <i class="fa-solid ${st.icon}"></i> ${esc(m.category)}
                        </span>
                        <span class="bg-green-100 text-green-700 text-xs px-3 py-1 rounded-full font-medium">
                            <i class="fa-solid fa-circle-check text-[10px] ml-1"></i>${esc(m.status)}
                        </span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        ${box('fa-user', 'نام و نام خانوادگی', m.name)}
                        ${box('fa-phone', 'تلفن همراه', m.phone, true)}
                        ${box('fa-location-dot', 'محل خدمت', place)}
                        ${box('fa-sitemap', 'واحد سازمانی', m.unit)}
                        ${box('fa-calendar-days', 'تاریخ و ساعت ثبت', m.date ? `${m.date.jDate} - ${m.date.time}` : 'نامشخص')}
                        ${box('fa-hashtag', 'کد رهگیری', m.tracking || 'نامشخص', true)}
                    </div>
                    <div class="bg-blue-50/50 rounded-lg p-2.5 border border-blue-100">
                        <div class="text-[10px] text-blue-600 mb-0.5 flex items-center gap-1"><i class="fa-solid fa-tag"></i> موضوع</div>
                        <div class="font-bold text-sm text-gray-800">${esc(m.subject)}</div>
                    </div>
                    <div>
                        <div class="text-[11px] text-gray-500 mb-1.5 flex items-center gap-1"><i class="fa-solid fa-comment-dots"></i> متن کامل پیام</div>
                        <div class="bg-gradient-to-bl from-blue-50 to-indigo-50/40 border border-blue-100 rounded-lg p-3.5 text-sm text-gray-700 leading-relaxed whitespace-pre-line max-h-60 overflow-y-auto modal-scroll">${esc(m.text)}</div>
                    </div>
                </div>`;
            const modal = document.getElementById('modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = '';
        }
        document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

        // ================ CHARTS ================
        Chart.register(ChartDataLabels);
        Chart.defaults.font.family = 'Vazirmatn, sans-serif';
        Chart.defaults.color = '#4b5563';

        const unitPalette = ['#6366f1','#8b5cf6','#ec4899','#0ea5e9','#14b8a6','#f59e0b','#84cc16','#f97316','#9ca3af'];
        const short = (s, n = 24) => s.length > n ? s.slice(0, n - 1) + '…' : s;

        function renderCharts() {
            charts.forEach(c => c.destroy());
            charts = [];

            // --- Doughnut: Category ---
            const cat = [...countBy(messages, m => m.category).entries()].sort((a, b) => b[1] - a[1]);
            charts.push(new Chart(document.getElementById('categoryChart').getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: cat.map(x => x[0]),
                    datasets: [{ data: cat.map(x => x[1]), backgroundColor: cat.map(x => styleOf(x[0]).chart),
                                 borderWidth: 2, borderColor: '#ffffff', hoverOffset: 6 }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, cutout: '58%',
                    plugins: {
                        legend: { position: 'bottom', labels: { usePointStyle: true, padding: 10, font: { size: 11 }, boxWidth: 8 } },
                        tooltip: { callbacks: { label: c => `${c.label}: ${c.raw} پیام` } },
                        datalabels: { color: '#000', font: { weight: 'bold', size: 12 }, formatter: v => v }
                    }
                }
            }));

            // --- Horizontal Bar: Unit (۸ واحد پرتعداد + سایر) ---
            const TOP = 8;
            let units = [...countBy(messages, m => m.unit).entries()].sort((a, b) => b[1] - a[1]);
            if (units.length > TOP + 1) {
                const rest = units.slice(TOP).reduce((s, x) => s + x[1], 0);
                units = units.slice(0, TOP).concat([['سایر واحدها', rest]]);
            }
            charts.push(new Chart(document.getElementById('unitChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: units.map(x => x[0]),
                    datasets: [{ data: units.map(x => x[1]),
                                 backgroundColor: units.map((x, i) => x[0] === 'نامشخص' || x[0] === 'سایر واحدها' ? '#9ca3af' : unitPalette[i % unitPalette.length]),
                                 borderRadius: 6, barThickness: 16 }]
                },
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                    layout: { padding: { left: 18 } },
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { title: i => units[i[0].dataIndex][0], label: c => `${c.raw} پیام` } },
                        datalabels: { color: '#1f2937', anchor: 'end', align: 'right', offset: 3, font: { weight: 'bold', size: 11 }, formatter: v => v }
                    },
                    scales: {
                        x: { beginAtZero: true, grace: '12%', ticks: { precision: 0, font: { size: 10 } }, grid: { color: '#f3f4f6' } },
                        y: { grid: { display: false }, ticks: { font: { size: 10 }, callback(v) { return short(this.getLabelForValue(v)); } } }
                    }
                }
            }));

            // --- Horizontal Bar: Location ---
            const locMap = new Map([['ستاد مرکزی', 0], ['بنیاد مسکن استان‌ها', 0], ['شرکت‌های تابعه', 0]]);
            messages.forEach(m => locMap.set(m.location, (locMap.get(m.location) || 0) + 1));
            const locs = [...locMap.entries()];
            const locColors = ['#3b82f6','#10b981','#8b5cf6','#f59e0b','#ec4899','#14b8a6'];
            charts.push(new Chart(document.getElementById('locationChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: locs.map(x => x[0]),
                    datasets: [{ data: locs.map(x => x[1]), backgroundColor: locs.map((x, i) => locColors[i % locColors.length]), borderRadius: 6, barThickness: 26 }]
                },
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: c => `${c.raw} پیام` } },
                        datalabels: { color: '#1f2937', anchor: 'end', align: 'right', offset: 4, font: { weight: 'bold', size: 12 }, formatter: v => v }
                    },
                    scales: {
                        x: { beginAtZero: true, grace: '12%', ticks: { precision: 0, font: { size: 10 } }, grid: { color: '#f3f4f6' } },
                        y: { grid: { display: false }, ticks: { font: { size: 11 } } }
                    }
                }
            }));
        }

        // ================ INIT ================
        loadData();
    </script>
</body>
</html>
